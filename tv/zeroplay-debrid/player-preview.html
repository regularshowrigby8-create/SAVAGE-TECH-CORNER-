<!doctype html><html><head><meta charset="utf-8"><title>ZeroPlay player</title><style>
.player-overlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:#000}
.player-spacer{flex:1 1 auto}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .55rem;border-radius:999px;background:rgba(255,255,255,.1);font-size:.7rem;font-weight:700}
.chip.violet{background:rgba(139,108,255,.25);color:#d9ccff}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.big-spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,.18);border-top-color:#8b6cff;border-radius:50%;animation:spin .9s linear infinite;margin:0 auto .8rem}
.player-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#dfe4ea;background:#000}
.zp-loading-hint{font-size:.78rem;color:#8d97a3;margin-top:.35rem}
.center-play{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;border:0;background:rgba(139,108,255,.92);color:#fff;font-size:1.6rem}
.player-sheet{position:absolute;inset:auto 0 0 0;z-index:30;background:#0e1016;border-top:1px solid #1e2430;border-radius:18px 18px 0 0;padding:1rem;max-height:70%;overflow:auto}
.player-sheet-inner{max-width:820px;margin:0 auto}
.player-sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem}
.player-sheet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.8rem}
.sheet-field{display:flex;flex-direction:column;gap:.3rem;font-size:.78rem;color:#9aa4af}
.sheet-actions{display:flex;gap:.4rem;flex-wrap:wrap}
.volume-wrap{display:flex;align-items:center;gap:.4rem}
.control-select{background:#161a22;border:1px solid #262d3a;color:#eef1f5;border-radius:9px;padding:.45rem .5rem}
.control-btn{display:inline-flex;align-items:center;justify-content:center;gap:.3rem;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#eef1f5;padding:0 .8rem;height:38px;font-size:.82rem;font-weight:600;cursor:pointer}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#eef1f5;cursor:pointer}
.player-indicator{position:absolute;top:12%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:.4rem .9rem;border-radius:999px;font-weight:700}
[hidden]{display:none!important}
/* ============================================================
   Player surface — restructured deck
   ------------------------------------------------------------
   The old surface was a flex column with a wrapping top bar and a
   two-row control block; at narrow widths the bar wrapped into two
   lines and the transport row overflowed, which is why controls
   appeared to pile up. The stage is now absolutely positioned with
   the chrome floating over it in three fixed zones (top strip,
   paused shelf, transport deck). Nothing can push anything else.
   ============================================================ */
.zp-player{--zp-accent:#8b6cff;--zp-accent-2:#5ee0c0;--zp-glass:rgba(14,16,22,.82);--zp-edge:rgba(255,255,255,.1)}
.zp-player .player-stage{position:absolute;inset:0;z-index:1}
.zp-player .player-stage video{width:100%;height:100%;object-fit:contain;background:#000}

.zp-top{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:.6rem;
  flex-wrap:nowrap;padding:.75rem clamp(.75rem,2vw,1.4rem) 2.6rem;
  background:linear-gradient(180deg,rgba(6,7,11,.94) 0%,rgba(6,7,11,.6) 55%,transparent 100%);
  transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s ease}
.zp-top .zp-title-block{display:flex;flex-direction:column;min-width:0;gap:.1rem}
.zp-top .pn{font-weight:800;letter-spacing:-.01em;font-size:clamp(.95rem,1.6vw,1.15rem);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(46vw,620px)}
.zp-top .player-title-sub{font-size:.74rem;color:#a9b2bd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(46vw,620px)}

.zp-round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  background:rgba(255,255,255,.08);border:1px solid var(--zp-edge);color:#fff;font-size:1.1rem;line-height:1;
  transition:background .18s ease,transform .18s ease}
.zp-round:hover{background:rgba(255,255,255,.16)}
.zp-round:focus-visible{outline:2px solid var(--zp-accent);outline-offset:2px}

.zp-ghost{background:rgba(255,255,255,.07);border:1px solid var(--zp-edge);color:#eef1f5;
  border-radius:999px;height:40px;padding:0 .85rem;font-size:.82rem;font-weight:600;
  white-space:nowrap;flex:0 0 auto;transition:background .18s ease,border-color .18s ease}
.zp-ghost:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.24)}
.zp-ghost:focus-visible{outline:2px solid var(--zp-accent);outline-offset:2px}

.zp-shelf{position:absolute;left:50%;transform:translateX(-50%);bottom:clamp(6.4rem,12vh,9rem);z-index:18;
  display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;justify-content:center;
  padding:.6rem .75rem;border-radius:18px;background:var(--zp-glass);
  border:1px solid var(--zp-edge);backdrop-filter:blur(14px);
  box-shadow:0 18px 44px rgba(0,0,0,.5);max-width:min(94vw,760px);
  transition:opacity .22s ease,transform .22s ease}
.zp-shelf[hidden],.zp-player:not(.player-paused) .zp-shelf{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(8px)}
.zp-shelf-primary{background:linear-gradient(135deg,var(--zp-accent),#6d4cf0)!important;
  border-color:transparent!important;color:#fff!important;font-weight:800!important}

.zp-deck{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:2.4rem clamp(.75rem,2vw,1.4rem) .85rem;
  background:linear-gradient(0deg,rgba(6,7,11,.96) 0%,rgba(6,7,11,.72) 48%,transparent 100%);
  display:flex;flex-direction:column;gap:.45rem;
  transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s ease}
.zp-scrub{display:flex;align-items:center;gap:.65rem;width:100%}
.zp-scrub input[type="range"]{flex:1 1 auto;min-width:0;height:20px;-webkit-appearance:none;appearance:none;background:transparent}
.zp-scrub input[type="range"]::-webkit-slider-runnable-track{height:5px;border-radius:999px;background:rgba(255,255,255,.22)}
.zp-scrub input[type="range"]::-moz-range-track{height:5px;border-radius:999px;background:rgba(255,255,255,.22)}
.zp-scrub input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;
  margin-top:-5px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(139,108,255,.35);cursor:pointer}
.zp-scrub input[type="range"]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#fff;
  box-shadow:0 0 0 4px rgba(139,108,255,.35);cursor:pointer}
.zp-time{font-variant-numeric:tabular-nums;font-size:.76rem;color:#b9c1cb;flex:0 0 auto;min-width:2.9rem;text-align:center}

.zp-actions{display:flex;align-items:center;gap:.4rem;flex-wrap:nowrap;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none;padding-bottom:2px}
.zp-actions::-webkit-scrollbar{display:none}
.zp-play{min-width:56px!important;height:46px!important;border-radius:999px!important;
  background:linear-gradient(135deg,var(--zp-accent),#6d4cf0)!important;border-color:transparent!important;
  color:#fff!important;font-size:1rem!important;font-weight:800!important;flex:0 0 auto}
.zp-actions .player-status{font-size:.75rem;color:#9aa4af;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:22vw;flex:0 1 auto}
.zp-actions .chip{flex:0 0 auto}

/* Narrow screens: drop the labels, keep the targets. Nothing is unreachable. */
@media (max-width:720px){
  .zp-top .player-title-sub{display:none}
  .zp-actions .player-status{display:none}
  .zp-ghost{padding:0 .6rem;font-size:.78rem}
  .zp-shelf{max-width:96vw;gap:.35rem;padding:.5rem}
  .zp-shelf .control-btn{min-width:auto!important;font-size:.78rem!important;height:42px!important}
}
@media (max-width:480px){
  .zp-actions #btnPlayerServersAlt,.zp-actions #btnPlayerMoreAlt{display:none}
  .zp-top #btnPlayerServers{display:none}
}

/* Playback running: the shelves are not part of the show. */
.zp-player.chrome-hidden .zp-shelf{opacity:0;pointer-events:none}
body{margin:0;background:#06070b;color:#eef1f5;font:14px/1.4 system-ui,-apple-system,sans-serif}
.frame{position:relative;width:100%;max-width:1180px;margin:22px auto;aspect-ratio:16/9;background:#000;overflow:hidden;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.cap{max-width:1180px;margin:0 auto 10px;padding:0 6px;color:#8d97a3;font-size:.82rem}
h1{max-width:1180px;margin:24px auto 6px;padding:0 6px;font-size:1.15rem}
</style></head><body>
<h1>ZeroPlay player — the surface that is now deployed</h1>
<p class="cap">Rendered from the real playerShell() in dist/index.html. Live at zeroplay-rd.vercel.app.</p>
<div class="frame"><div id="mount"></div></div>
<script>
const st={item:{id:603,type:"movie",title:"The Matrix",year:1999},source:"global",variants:[],direct:true,
engine:"native",playback:{paused:false,rate:1,volume:1},season:1,episode:1,tried:new Set(),
tempSource:{id:"global",name:"Global finder"}};
const esc=s=>String(s??"");
const titleOf=it=>it.title;
const ZP_RESIZE_LABELS={fit:"Fit to screen"};
const zpEngineResizeMode=()=>"fit";
const qualityOptionsHTML=()=>'<option>Auto</option>';
const playerTracksModalHTML=()=>"";
const downloadsEnabled=()=>true;
const directQueueStatus=()=>null;
const getSource=()=>null;
const withPlayerRuntime=s=>s;
let playerState=st;
function playerShell(msg){
  const st=withPlayerRuntime(playerState); playerState=st;
  const it=st.item, isTV=it.type==="tv";
  const rate=Number(st.playback&&st.playback.rate||1);
  const queue=directQueueStatus(st);
  const src=(st.tempSource||getSource(st.source));
  const engineLabel=st.engine==="native"?(st.playingQualityLabel||"ZeroPlay player"):st.direct?"ZeroPlay player":"Connecting";
  /* Layer order is deliberate and mirrors what the reference players converge
     on: a black stage, a thin identity strip, a transport deck, and a paused
     shelf that only exists while paused. Every control keeps the id it had so
     no handler binding changes — this is a restructure of the surface, not a
     rewrite of the behaviour underneath it. */
  return '<div class="player-overlay zp-player" id="playerOverlay">'

    /* stage */
    +'<div class="player-stage" id="playerStage" data-player>'
      +'<div class="player-loading" id="playerLoading"><div class="big-spinner"></div><strong data-loading-text>'+esc(msg||"Connecting…")+'</strong><span class="zp-loading-hint">Finding the best available stream…</span></div>'
    +'</div>'

    /* top strip — identity on the left, the two exits and the episode step on the right */
    +'<div class="player-bar zp-top" id="playerTopBar" data-tv-row="player-top">'
      +'<button class="icon-btn zp-round" id="btnBackPlayer" type="button" aria-label="Back">‹</button>'
      +'<div class="zp-title-block">'
        +'<span class="pn" id="playerTitle">'+esc(titleOf(it))+'</span>'
        +'<span class="player-title-sub" id="playerSourceLine">'+(isTV?"S"+"·"+st.season+"E"+st.episode:"Movie")+(src&&src.name?" · "+esc(src.name):"")+'</span>'
      +'</div>'
      +'<span id="fastBadge" class="chip violet"></span>'
      +'<span class="player-spacer"></span>'
      +(isTV?'<button class="control-btn zp-ghost" id="btnPrevEp" type="button" aria-label="Previous episode">‹ Ep</button>'
             +'<button class="control-btn zp-ghost" id="btnNextEp" type="button" aria-label="Next episode">Ep ›</button>':"")
      +'<button class="control-btn zp-ghost" id="btnPlayerServers" type="button">Servers</button>'
      +'<button class="control-btn zp-ghost" id="btnPlayerMore" type="button" aria-expanded="false" aria-label="More tools">⋯</button>'
      +'<button class="icon-btn zp-round" id="btnClosePlayer" type="button" aria-label="Close player">×</button>'
    +'</div>'

    +'<button class="center-play" id="btnCenterPlay" type="button" aria-label="Play" hidden>▶</button>'

    /* paused shelf — appears only while paused, between stage and transport */
    +'<div class="player-action-shelf zp-shelf" id="playerActionShelf" aria-label="Paused player tools" data-tv-row="player-shelf">'
      +'<button class="control-btn primary zp-shelf-primary" id="btnPlayerResume" type="button">▶ Resume</button>'
      +'<button class="control-btn" id="btnPlayerServersStage" type="button">Servers</button>'
      +'<button class="control-btn" id="btnPlayerDownloadStage" type="button">⬇ Download</button>'
      +'<button class="control-btn" id="btnPlayerM3u" type="button">M3U tools</button>'
      +'<button class="control-btn" id="btnPlayerQuality" type="button">Quality</button>'
    +'</div>'

    /* transport deck — one scrub row, one action row, nothing else */
    +'<div class="player-controls zp-deck" id="playerControls" data-mode="loading" data-tv-row="player-transport">'
      +'<div class="zp-scrub">'
        +'<span class="zp-time" id="currentTime">0:00</span>'
        +'<input id="seekRange" type="range" min="0" max="100" value="0" step="1" aria-label="Seek">'
        +'<span class="zp-time" id="durationTime">0:00</span>'
      +'</div>'
      +'<div class="zp-actions" data-tv-row="player-transport-buttons">'
        +'<button class="control-btn primary zp-play" id="btnPlayPause" type="button" aria-label="Play or pause">▶</button>'
        +'<button class="control-btn zp-ghost" id="btnBack10" type="button" aria-label="Back 10 seconds">−10</button>'
        +'<button class="control-btn zp-ghost" id="btnForward10" type="button" aria-label="Forward 10 seconds">+10</button>'
        +'<button class="control-btn zp-ghost" id="btnPlayerTracks" type="button" aria-label="Subtitles and audio">CC · Audio</button>'
        +'<button class="control-btn zp-ghost" id="btnPlayerAspect" type="button" aria-label="Screen size">'+esc(ZP_RESIZE_LABELS[zpEngineResizeMode()]||"Fit to screen")+'</button>'
        +'<span class="player-status" id="playerMeta">Connecting…</span>'
        +'<span class="player-spacer"></span>'
        +'<span class="chip" id="playerEngine">'+esc(engineLabel)+'</span>'
        +'<button class="control-btn zp-ghost" id="btnPlayerServersAlt" type="button">Servers</button>'
        +'<button class="control-btn zp-ghost" id="btnPlayerMoreAlt" type="button" aria-label="More tools">⋯</button>'
      +'</div>'
    +'</div>'

    /* More sheet */
    +'<div class="player-sheet" id="playerMoreSheet" hidden data-tv-row="player-sheet-more" aria-label="More player tools">'
      +'<div class="player-sheet-inner">'
        +'<div class="player-sheet-head"><strong>Playback tools</strong><button class="icon-btn" id="btnClosePlayerMore" type="button" aria-label="Close tools">×</button></div>'
        +'<div class="player-sheet-grid">'
          +'<label class="sheet-field"><span>Quality</span><select class="control-select" id="playerQuality" aria-label="Playback quality">'+qualityOptionsHTML(st)+'</select></label>'
          +'<label class="sheet-field"><span>Speed</span><select class="control-select" id="playerRate" aria-label="Playback speed">'+[.5,.75,1,1.25,1.5,2].map(r=>'<option value="'+r+'"'+(rate===r?" selected":"")+'>'+r+'×</option>').join("")+'</select></label>'
          +'<div class="sheet-field"><span>Volume</span><div class="volume-wrap"><button class="control-btn" id="btnMute" type="button" aria-label="Mute or unmute">🔊</button><input id="volumeRange" type="range" min="0" max="1" step="0.02" value="'+Number(st.playback&&st.playback.volume||1)+'" aria-label="Volume"></div></div>'
          +'<div class="sheet-field"><span>Screen</span><div class="sheet-actions">'
            +'<button class="control-btn" id="btnPiP" type="button" aria-label="Picture in picture">PiP</button>'
            +'<button class="control-btn" id="btnFullscreen" type="button" aria-label="Fullscreen">⛶ Fullscreen</button>'
          +'</div></div>'
          +'<div class="sheet-field"><span>This title</span><div class="sheet-actions">'
            +(downloadsEnabled()?'<button class="control-btn" id="btnPlayerDownload" type="button" aria-label="Download this title or episode">⬇ Download</button>':"")
            +'<button class="control-btn" id="btnPlayerDetails" type="button">Details</button>'
          +'</div></div>'
        +'</div>'
        +(queue?'<p class="player-sheet-note" id="playerQueueLine">Source '+queue.index+' of '+queue.total+(queue.remaining?' · '+queue.remaining+' more queued':'')+'</p>':"")
      +'</div>'
    +'</div>'
    +playerTracksModalHTML(st)
    +'<div class="player-paused-card" id="playerPausedCard" hidden data-tv-row="player-paused">'
      +'<span class="ppc-ep" id="playerPausedTitle"></span>'
      +'<p class="ppc-overview" id="playerPausedOverview"></p>'
      +'<span class="ppc-where" id="playerPausedWhere"></span>'
    +'</div>'
    +'<div class="player-indicator" id="playerIndicator" hidden aria-live="polite"></div></div>';
}

document.getElementById("mount").innerHTML=playerShell("Connecting…");
</script></body></html>
