<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ZeroPlay — keyless movie and TV discovery with continuous server/addon identification and exact title matching.">
<meta name="theme-color" content="#101214">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https:; frame-src https:; media-src https: blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>ZeroPlay</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%237c3aed'/><path d='M38 28 L72 50 L38 72 Z' fill='white'/></svg>">
<link rel="manifest" href='data:application/manifest+json,{"name":"ZeroPlay","short_name":"ZeroPlay","display":"standalone","background_color":"%23101214","theme_color":"%23101214","start_url":"."}'>
<link rel="preconnect" href="https://vidstuck.cc" crossorigin>
<link rel="preconnect" href="https://zxcstream.cc" crossorigin>
<link rel="preconnect" href="https://embedwave.cc" crossorigin>
<link rel="preconnect" href="https://image.tmdb.org" crossorigin>
<link rel="dns-prefetch" href="https://api.themoviedb.org">
<link rel="dns-prefetch" href="https://www.youtube-nocookie.com">
<style>
/* ============================================================
   ZeroPlay — restrained premium streaming interface
   Palette & components ported from brett0x0/debrid-stream
   (public/style.css): GitHub-dark surfaces + violet primary.
   Streaming UI (rails, posters, player) built in the same language.
   ============================================================ */
:root{
  --bg:#101214; --surface:#171a1d; --surface2:#1d2125; --surface-border:#292e33;
  --primary:#7c3aed; --primary-hover:#6d2ee0;
  --text:#d5d9dc; --text-heading:#f7f7f5; --text-muted:#9aa1a6;
  --accent:#d8b36a; --success:#3da66a; --success-text:#63c48a; --error:#f06a5e;
  --violet-soft:#b794f6; --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;letter-spacing:-.005em}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px;height:8px}::-webkit-scrollbar-thumb{background:#30363d;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;background:var(--bg);border-bottom:1px solid var(--surface-border)}
.topbar-inner{max-width:1400px;margin:0 auto;padding:.7rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.logo-badge{display:inline-block;background:transparent;color:var(--text-heading);border:0;padding:.25rem 0;border-radius:0;font-size:1rem;font-weight:750;letter-spacing:-.02em;white-space:nowrap;cursor:pointer}
.logo-badge:hover{text-decoration:none;color:#fff}
.nav{display:flex;gap:.35rem;flex-wrap:wrap}
.nav button{background:transparent;border:1px solid transparent;color:var(--text);padding:.45rem .8rem;border-radius:6px;cursor:pointer;font-weight:600;font-size:.9rem;transition:all .2s}
.nav button:hover{background:#21262d;color:var(--text-heading)}
.nav button.active{background:var(--surface2);border-color:transparent;color:#fff;box-shadow:inset 0 -2px 0 var(--primary)}
.topbar-search{flex:1;min-width:200px;display:flex;gap:.5rem}
.catalog-state{color:var(--text-muted);font-size:.8rem;white-space:nowrap}


/* ---------- DebridStream components (ported) ---------- */
.container{max-width:720px;margin:0 auto;padding:2rem 1rem}
.header{text-align:center;margin-bottom:2rem}
.header h1{color:var(--text-heading);font-size:2rem;font-weight:700;margin-bottom:.5rem}
.subtitle{color:var(--text-muted);font-size:1rem}
.card{background:var(--surface);border:0;border-radius:var(--radius);padding:2rem;box-shadow:none}
.section{margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--surface-border)}
.section:last-of-type{border-bottom:none}
.section-header-flex{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;gap:.5rem;flex-wrap:wrap}
.btn-group{display:flex;gap:.5rem}
.section h2{color:var(--text-heading);font-size:1.2rem}
.category-heading{color:var(--violet-soft);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;margin-top:1.25rem;margin-bottom:.5rem}
.section-desc{color:var(--text-muted);font-size:.9rem;margin-bottom:.75rem}
.form-group{margin-bottom:1.25rem}
.form-row{display:flex;gap:1rem}
.form-row .form-group{flex:1}
label{display:block;font-weight:500;color:var(--text-heading);margin-bottom:.4rem;font-size:.9rem}
.required{color:var(--error)}
input[type="text"],input[type="password"],input[type="number"],input[type="search"],select,textarea{width:100%;padding:.65rem .85rem;background:#111417;border:1px solid var(--surface-border);border-radius:6px;color:var(--text-heading);font-size:.95rem;transition:border-color .2s;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(124,58,237,.35);outline-offset:1px;border-color:var(--primary);box-shadow:none}
.input-with-action{display:flex;gap:.5rem}
.input-with-action input{flex:1}
.help-text{display:block;color:var(--text-muted);font-size:.8rem;margin-top:.4rem}
.help-text a{color:var(--accent);text-decoration:none}
.help-text a:hover{text-decoration:underline}
.status-box{margin-top:.75rem;padding:.75rem;border-radius:6px;font-size:.85rem}
.status-box.success{background:rgba(46,160,67,.15);border:1px solid rgba(46,160,67,.4);color:var(--success-text)}
.status-box.error{background:rgba(248,81,73,.15);border:1px solid rgba(248,81,73,.4);color:var(--error)}
.status-box.info{background:rgba(88,166,255,.12);border:1px solid rgba(88,166,255,.4);color:var(--accent)}
.checkbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:.65rem}
.checkbox-card{position:relative;display:flex;background:#0d1117;border:1px solid var(--surface-border);border-radius:8px;padding:.65rem .75rem;cursor:pointer;user-select:none;transition:all .2s ease;margin:0}
.checkbox-card:hover{border-color:var(--accent)}
.checkbox-card input{position:absolute;opacity:0}
.checkbox-card input:checked+.card-content{color:var(--violet-soft)}
.checkbox-card input:checked~.card-content .title{color:var(--text-heading)}
.checkbox-card:has(input:checked){border-color:var(--primary);background:rgba(138,43,226,.1)}
.card-content{display:flex;flex-direction:column}
.card-content .title{font-weight:600;font-size:.9rem}
.card-content .sub{font-size:.75rem;color:var(--text-muted)}
.actions{display:flex;flex-direction:column;gap:.75rem;margin-top:1.5rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;font-weight:600;padding:.65rem 1.25rem;border-radius:6px;border:none;cursor:pointer;transition:all .2s;font-size:.95rem;color:var(--text-heading);background:#21262d}
.btn:disabled{opacity:.55;cursor:wait}
.btn-xs{padding:.25rem .65rem;font-size:.75rem;border-radius:4px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:var(--surface2);color:var(--text-heading);border:1px solid transparent}
.btn-secondary:hover{background:#30363d}
.btn-outline{background:transparent;color:var(--text-heading);border:1px solid var(--surface-border)}
.btn-outline:hover{background:#21262d}
.btn-large{padding:.9rem 1.5rem;font-size:1.05rem}
.btn-danger{background:transparent;border:1px solid rgba(248,81,73,.5);color:var(--error)}
.btn-danger:hover{background:rgba(248,81,73,.12)}
.install-notice{margin-top:1.5rem;background:#0d1117;border:1px solid var(--surface-border);border-radius:8px;padding:1rem}
.install-notice p{font-size:.85rem;color:var(--text-muted);margin-bottom:.5rem}
.install-notice input{font-family:monospace;font-size:.85rem}
.toggle-group .switch-label{display:flex;align-items:center;justify-content:space-between;gap:1rem;cursor:pointer}
.switch-label input{position:absolute;opacity:0;width:0;height:0}
.slider{position:relative;flex:none;width:46px;height:24px;background:#21262d;border:1px solid var(--surface-border);border-radius:9999px;transition:all .2s}
.slider::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#8b949e;transition:all .2s}
.switch-label input:checked+.slider{background:var(--primary);border-color:var(--primary)}
.switch-label input:checked+.slider::after{transform:translateX(22px);background:#fff}
.footer{text-align:center;margin-top:2rem;color:var(--text-muted);font-size:.8rem;padding:0 1rem 2.5rem}

/* ---------- Streaming UI (DebridStream language) ---------- */
.page{max-width:1400px;margin:0 auto;padding:1.25rem 1rem 2rem}
.page h1{color:var(--text-heading);font-size:1.6rem;margin-bottom:.25rem}
.page .lede{color:var(--text-muted);font-size:.92rem;margin-bottom:1.25rem}
.demo-banner{max-width:1400px;margin:1rem auto 0;padding:0 1rem}
.demo-banner .status-box{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;justify-content:space-between}
.hero{position:relative;border:0;border-radius:var(--radius);overflow:hidden;background:var(--surface);min-height:360px;display:flex;align-items:flex-end;box-shadow:none;margin-bottom:2rem}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,17,23,.95) 8%,rgba(13,17,23,.55) 55%,rgba(13,17,23,.15)),linear-gradient(0deg,rgba(13,17,23,.95),transparent 55%)}
.hero-body{position:relative;padding:2rem;max-width:640px}
.hero-body .logo-badge{margin-bottom:.9rem}
.hero-body h1{font-size:2.2rem;line-height:1.15;color:var(--text-heading);margin-bottom:.5rem}
.hero-meta{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--text-muted);margin-bottom:.6rem}
.hero-body p{font-size:.95rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:1.1rem}
.hero-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:transparent;border:0;color:var(--text-muted);border-radius:0;padding:0;font-size:.76rem;font-weight:600}
.chip.rd{color:var(--success-text)}
.chip.violet{color:var(--violet-soft)}
.chip.star{color:#e3b341}
.rail{margin-bottom:1.9rem}
.rail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem}
.rail-head h2{color:var(--text-heading);font-size:1.15rem}
.rail-head h2 .rd-plus{color:var(--success-text);font-size:.8rem;vertical-align:middle}
.rail-arrows{display:flex;gap:.4rem}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;background:#21262d;border:1px solid var(--surface-border);border-radius:6px;color:var(--text-heading);cursor:pointer;font-size:1rem;transition:all .2s}
.icon-btn:hover{background:#30363d;border-color:var(--accent)}
.rail-track{display:flex;gap:.8rem;overflow-x:auto;padding-bottom:.5rem;scroll-snap-type:x mandatory;scrollbar-width:thin}
.rail-track .poster-card{flex:0 0 154px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:1rem}
.poster-card{background:transparent;border:0;border-radius:0;overflow:visible;cursor:pointer;transition:transform .18s ease;position:relative}
.poster-card:hover{transform:translateY(-2px);box-shadow:none}
.poster-wrap{position:relative;aspect-ratio:2/3;background:#111417;border-radius:6px;overflow:hidden}
.poster-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.poster-badges{position:absolute;top:.45rem;left:.45rem;display:flex;gap:.3rem;flex-wrap:wrap}
.poster-rate{position:absolute;top:.45rem;right:.45rem;background:rgba(10,11,12,.82);border:0;color:#f0c66b;border-radius:4px;font-size:.72rem;font-weight:700;padding:.15rem .45rem}
.hover-actions{position:absolute;inset:0;background:linear-gradient(0deg,rgba(13,17,23,.92) 20%,rgba(13,17,23,.25));display:flex;flex-direction:column;justify-content:flex-end;gap:.45rem;padding:.7rem;opacity:0;transition:opacity .2s}
.poster-card:hover .hover-actions,.poster-card:focus-within .hover-actions{opacity:1}
.hover-actions .btn{padding:.45rem .6rem;font-size:.82rem;width:100%}
.progress-track{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(240,246,252,.18)}
.progress-fill{height:100%;background:var(--primary)}
.remove-x{position:absolute;top:.45rem;right:.45rem;z-index:3}
.poster-meta{padding:.55rem .05rem .75rem}
.poster-meta .t{color:var(--text-heading);font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poster-meta .s{color:var(--text-muted);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:1.2rem}
.filters .form-group{flex:1 1 160px;margin:0}
.chip-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.2rem}
.chip-btn{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--text-muted);border-radius:0;padding:.35rem .2rem;font-weight:650;font-size:.85rem;cursor:pointer;transition:all .2s}
.chip-btn:hover{border-color:var(--accent)}
.chip-btn.active{border-bottom-color:var(--primary);background:transparent;color:#fff}
.load-more{display:flex;justify-content:center;margin:1.6rem 0 .5rem}
.empty{background:transparent;border:0;border-top:1px solid var(--surface-border);border-radius:0;padding:2rem 1rem;text-align:left;color:var(--text-muted)}
.empty h3{color:var(--text-heading);margin-bottom:.4rem}
.skel{background:transparent;border:0;border-radius:6px;overflow:hidden}
.skel .ph{aspect-ratio:2/3;background:linear-gradient(100deg,#161b22 40%,#21262d 50%,#161b22 60%);background-size:200% 100%;animation:shim 1.4s infinite}
@keyframes shim{to{background-position:-200% 0}}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(240,246,252,.25);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Detail modal ---------- */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(1,4,9,.78);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:2.5vh 1rem}
.modal{width:min(980px,100%);background:var(--surface);border:0;border-radius:8px;box-shadow:0 24px 60px rgba(0,0,0,.45);overflow:hidden;position:relative}
.modal-close{position:absolute;top:.8rem;right:.8rem;z-index:5}
.detail-hero{position:relative;min-height:300px;display:flex;align-items:flex-end}
.detail-hero .hero-bg{opacity:.5}
.detail-body{position:relative;padding:1.6rem 2rem 2rem;display:grid;grid-template-columns:170px 1fr;gap:1.6rem;margin-top:-90px}
.detail-poster{border-radius:6px;border:0;width:170px;aspect-ratio:2/3;object-fit:cover;background:#111417;box-shadow:none}
.detail-body h2{color:var(--text-heading);font-size:1.7rem;line-height:1.2;margin-bottom:.5rem}
.detail-body .overview{font-size:.94rem;margin:.8rem 0 1.1rem}
.detail-actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.detail-section{padding:0 2rem 1.4rem}
.detail-section h3{color:var(--text-heading);font-size:1.02rem;margin-bottom:.65rem}
.cast-track{display:flex;gap:.8rem;overflow-x:auto;padding-bottom:.5rem}
.cast{flex:0 0 96px;text-align:center}
.cast img,.cast .avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:1px solid var(--surface-border);background:#21262d;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--violet-soft);font-size:1.3rem;margin:0 auto}
.cast .n{font-size:.78rem;color:var(--text-heading);font-weight:600;margin-top:.4rem;line-height:1.25}
.cast .c{font-size:.72rem;color:var(--text-muted);line-height:1.25}
.ep-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.6rem}
.ep{display:flex;gap:.7rem;align-items:center;background:#0d1117;border:1px solid var(--surface-border);border-radius:8px;padding:.55rem .7rem;cursor:pointer;transition:all .2s;text-align:left;color:var(--text)}
.ep:hover{border-color:var(--primary)}
.ep .num{flex:none;width:34px;height:34px;border-radius:6px;background:rgba(138,43,226,.15);border:1px solid rgba(138,43,226,.4);color:var(--violet-soft);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.ep .et{font-size:.83rem;color:var(--text-heading);font-weight:600;line-height:1.3}
.ep .es{font-size:.72rem;color:var(--text-muted)}
.season-row{display:flex;gap:.7rem;align-items:end;flex-wrap:wrap;margin-bottom:.8rem}
.season-row .form-group{margin:0;min-width:180px}

/* ---------- Player ---------- */
.player-overlay{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column}
.player-bar{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;background:#0d1117;border-bottom:1px solid var(--surface-border);padding:.6rem .9rem}
.player-bar .pt{color:var(--text-heading);font-weight:700;font-size:.95rem;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.player-bar select{width:auto;padding:.45rem .6rem;font-size:.85rem}
.player-frame{flex:1;width:100%;border:0;background:#000}
.player-hint{background:#0d1117;color:var(--text-muted);font-size:.76rem;padding:.4rem .9rem;border-top:1px solid var(--surface-border)}

/* ---------- Toasts ---------- */
#toasts{position:fixed;right:1rem;bottom:1rem;z-index:120;display:flex;flex-direction:column;gap:.5rem;max-width:min(360px,90vw)}
.toast{background:#22262b;border:1px solid #343a40;border-radius:6px;color:var(--text-heading);padding:.7rem .9rem;font-size:.87rem;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.toast.success{color:#dff5e8}
.toast.error{color:#ffe1de}

/* ---------- Sources / FastStream (TV prototype) ---------- */
#preloadSlot{position:fixed;left:-9999px;top:-9999px;width:320px;height:180px;overflow:hidden}
.player-stage{flex:1;display:flex;flex-direction:column;background:#000;min-height:0}
.player-stage .player-frame{flex:1;min-height:0}
.hud{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center;background:#0d1117;border-top:1px solid var(--surface-border);padding:.5rem .9rem}
.health{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--text-muted)}
.health-dot{width:10px;height:10px;border-radius:50%;background:#6e7681;flex:none}
.health-dot.ok{background:var(--success-text)}
.health-dot.slow{background:#e3b341}
.health-dot.bad{background:var(--error)}
.src-row{display:flex;gap:.8rem;align-items:flex-start;background:transparent;border:0;border-bottom:1px solid var(--surface-border);border-radius:0;padding:.95rem 0;margin-bottom:0;flex-wrap:wrap}
.src-row .grow{flex:1;min-width:220px}
.src-row .nm{color:var(--text-heading);font-weight:700}
.src-row code{display:block;font-size:.72rem;color:var(--text-muted);word-break:break-all;font-family:ui-monospace,monospace;margin-top:.15rem}
.src-actions{display:flex;gap:.45rem;flex-wrap:wrap}
.log-list{list-style:none;max-height:190px;overflow:auto;font-size:.83rem}
.log-list li{padding:.35rem 0;border-bottom:1px solid #21262d;color:var(--text)}
.log-list li span{color:var(--text-muted);font-size:.75rem;margin-right:.5rem}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.65rem;margin-bottom:1rem}
.stat{background:transparent;border:0;border-left:1px solid var(--surface-border);border-radius:0;padding:.35rem .75rem}
.stat .k{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.stat .v{color:var(--text-heading);font-weight:700}
input[type="range"]{width:100%;accent-color:var(--primary)}
.panel{background:var(--surface);border:0;border-radius:var(--radius);padding:1.5rem;box-shadow:none;margin-bottom:1.5rem}
.panel h2{color:var(--text-heading);font-size:1.15rem;margin-bottom:.4rem}
.panel .section-desc{margin-bottom:1rem}
video.player-frame{width:100%;height:100%;background:#000}
body.locked{overflow:hidden}

/* ---------- Continuous discovery registry ---------- */
.panel-head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;flex-wrap:wrap}
.panel-head .section-desc{max-width:820px}
.discovery-status{padding:.8rem 0;border-top:1px solid var(--surface-border);border-bottom:1px solid var(--surface-border);color:var(--text-heading);font-size:.9rem;margin:.6rem 0 1rem}
.discovery-stats{display:flex;gap:1.4rem;flex-wrap:wrap;color:var(--text-muted);font-size:.88rem;margin-bottom:1rem}
.discovery-stats strong{color:#fff;font-size:1.02rem;margin-right:.25rem}
.discovery-actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.8rem 0 1rem}
.discovery-actions .help-text{margin:0;max-width:620px}
.seed-add{display:flex;gap:.7rem;align-items:end;flex-wrap:wrap}.seed-add .grow{flex:1;min-width:240px}.seed-add .form-group{margin-bottom:0}
details.advanced{border-top:1px solid var(--surface-border);margin-top:1.25rem;padding-top:1rem}details.advanced summary{cursor:pointer;color:var(--text-heading);font-weight:700;margin-bottom:1rem}.advanced-body{padding-top:.25rem}
.crawler-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.55rem 1rem;margin-bottom:1rem}

"use strict";
/* =====================================================================
   ZeroPlay (single-file build)
   - Zero-config catalogue: server-side TMDB when a deployment provides it,
     otherwise keyless Cinemeta, otherwise offline demo data.
   - Continuous crawlers identify servers/addons before installing them.
   - A canonical title identifier verifies movie/series/episode candidates.
   ===================================================================== */

/* ---------------- Android TV shell profile ---------------- */
const APP_VERSION="4.3.0";
const ZERO_PLAY_TV_PARAMS=new URLSearchParams(location.search||"");
const ANDROID_TV_APP=/^(1|true|yes)$/i.test(ZERO_PLAY_TV_PARAMS.get("androidtv")||"")||/ZeroPlayTV\//i.test(navigator.userAgent||"")||!!window.ZeroPlayAndroidTV;

/* ---------------- built-in title identifier ----------------
   The catalogue item is converted into one canonical identity: TMDB id,
   IMDb id, media type, release year, season/episode and every known title
   variant. Crawled servers/addons are searchable, but a candidate result is
   only accepted when this identifier says it is the requested work. */
function identityNormalizeTitle(value){
  return String(value||"")
    .replace(/\s*\(source test\)\s*$/i,"")
    .normalize("NFKD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/&/g," and ")
    .replace(/\b(the|a|an)\b/g," ")
    .replace(/[^a-z0-9]+/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function identityUnique(values){
  const out=[], seen=new Set();
  for(const v of values||[]){
    const s=String(v||"").trim();
    if(!s) continue;
    const k=s.toLowerCase();
    if(seen.has(k)) continue;
    seen.add(k); out.push(s);
  }
  return out;
}
function identityAlternativeTitles(raw){
  const out=[];
  const push=v=>{ if(v) out.push(v); };
  const alt=raw&&(raw.alternative_titles||raw.alternativeTitles);
  if(Array.isArray(raw&&raw.altTitles)) raw.altTitles.forEach(push);
  if(Array.isArray(raw&&raw.alternatives)) raw.alternatives.forEach(push);
  if(raw){
    push(raw.original_title); push(raw.original_name); push(raw.originalTitle); push(raw.originalName);
  }
  if(alt){
    const lists=[alt.titles,alt.results,Array.isArray(alt)?alt:null].filter(Array.isArray);
    for(const list of lists) for(const x of list) push(typeof x==="string"?x:(x&&(x.title||x.name)));

function identityParseEpisode(text){

  let m=s.match(/\bs\s*(\d{1,3})\s*e\s*(\d{1,4})\b/);
  if(m) return {season:Number(m[1]),episode:Number(m[2])};
  m=s.match(/\bseason\s*(\d{1,3})\b[^\d]{0,24}\bepisode\s*(\d{1,4})\b/);
  if(m) return {season:Number(m[1]),episode:Number(m[2])};
  m=s.match(/\b(\d{1,2})x(\d{1,4})\b/);
  if(m) return {season:Number(m[1]),episode:Number(m[2])};
  const season=(s.match(/\b(?:season|series|part|cour)\s*(\d{1,3})\b/)||[])[1];
  const episode=(s.match(/\b(?:episode|ep)\s*(\d{1,4})\b/)||[])[1];
  return {season:season==null?null:Number(season),episode:episode==null?null:Number(episode)};
}
function identityExtractIds(text){

  const imdb=(s.match(/\btt\d{6,}\b/i)||[])[0]||"";

function identityCandidateSlug(url){

    const parts=u.pathname.split("/").filter(Boolean).map(x=>{ try{return decodeURIComponent(x);}catch{return x;} });
    const useful=parts.filter(p=>!/^(anime|movie|movies|tv|series|show|watch|detail|info|play|title|video|stream|embed|episode|season|ep-\d+|\d+)$/i.test(p));

function identityTitleScore(candidateTitle, identity){
  const cand=identityCleanCandidateTitle(candidateTitle);
  if(!cand||!identity) return {score:0,matchedTitle:""};
  let best=0, matchedTitle="";
  const candTokens=new Set(cand.split(" ").filter(Boolean));
  for(let i=0;i<(identity.normalizedTitles||[]).length;i++){
    const target=identity.normalizedTitles[i];
    if(!target) continue;
    let score=0;
    if(cand===target) score=100;
    else if(cand.startsWith(target+" ")){
      const extra=cand.split(" ").length-target.split(" ").length;
      score=Math.max(70,92-extra*4);
    }else if(target.startsWith(cand+" ")) score=84;
    else{
      const targetTokens=new Set(target.split(" ").filter(Boolean));
      let hit=0;
      for(const t of targetTokens) if(candTokens.has(t)) hit++;
      const containment=hit/Math.max(1,targetTokens.size);
      const jaccard=hit/Math.max(1,new Set([...targetTokens,...candTokens]).size);
      score=Math.round(containment*60+jaccard*34);

function identifyTitleCandidate(candidate, identity, options){
  candidate=candidate||{}; options=options||{};

  const text=[candidate.title,candidate.name,candidate.label,candidate.description,candidate.url,candidate.id].filter(Boolean).join(" ");
  const ids=identityExtractIds([candidate.imdbId,candidate.imdb_id,candidate.tmdbId?("tmdb:"+candidate.tmdbId):"",text].join(" "));
  if(candidate.imdbId||candidate.imdb_id) ids.imdbId=String(candidate.imdbId||candidate.imdb_id).toLowerCase();
  if(candidate.tmdbId||candidate.moviedb_id) ids.tmdbId=Number(candidate.tmdbId||candidate.moviedb_id)||ids.tmdbId;
  if(identity.imdbId&&ids.imdbId&&identity.imdbId!==ids.imdbId) return {score:0,verdict:"rejected",accepted:false,hardReject:true,reasons:["different IMDb id"],candidateIds:ids};
  if(identity.tmdbId&&ids.tmdbId&&Number(identity.tmdbId)!==Number(ids.tmdbId)) return {score:0,verdict:"rejected",accepted:false,hardReject:true,reasons:["different TMDB id"],candidateIds:ids};

  const episodeInfo=identityParseEpisode(text);
  let episodeConflict=false;
  if(identity.type==="tv"){
    if(episodeInfo.season!=null&&episodeInfo.season!==Number(identity.season||1)){ episodeConflict=true; reasons.push("different season"); }
    if(episodeInfo.episode!=null&&episodeInfo.episode!==Number(identity.episode||1)){ episodeConflict=true; reasons.push("different episode"); }
  }
  if(episodeConflict&&!options.idVerified) return {score:0,verdict:"rejected",accepted:false,hardReject:true,reasons,candidateIds:ids,episodeInfo};
  if(episodeConflict&&options.idVerified) return {score:0,verdict:"rejected",accepted:false,hardReject:true,reasons,candidateIds:ids,episodeInfo};

  const idExact=(identity.imdbId&&ids.imdbId&&identity.imdbId===ids.imdbId)||(identity.tmdbId&&ids.tmdbId&&Number(identity.tmdbId)===Number(ids.tmdbId));
  if(idExact) reasons.push("exact catalogue id");
  if(options.idVerified) reasons.push(options.idEvidence||"provider queried by exact catalogue id");

  const titleTexts=identityUnique([candidate.title,candidate.name,candidate.label,candidate.description,identityCandidateSlug(candidate.url)]);
  let title={score:0,matchedTitle:""};
  for(const t of titleTexts){
    const scored=identityTitleScore(t,identity);
    if(scored.score>title.score) title=scored;
  }
  let score=title.score;
  if(title.score>=80) reasons.push("title match");
  else if(title.score>=55) reasons.push("partial title match");

  const candYear=String(candidate.year||candidate.releaseInfo||candidate.released||"").slice(0,4);
  if(candYear&&/^\d{4}$/.test(candYear)&&!years.includes(candYear)) years.push(candYear);
  if(identity.year&&years.length){
    if(years.includes(identity.year)){ score=Math.min(100,score+4); reasons.push("year match"); }
    else { score=Math.max(0,score-14); reasons.push("year differs"); }
  }
  const candType=String(candidate.type||candidate.media_type||"").toLowerCase();
  if(candType){
    const normalizedType=(candType==="series"||candType==="tv")?"tv":"movie";
    if(normalizedType!==identity.type){ score=Math.max(0,score-25); reasons.push("media type differs"); }
    else reasons.push("media type match");
  }
  if(idExact||options.idVerified){
    // Exact-ID provider responses often have generic labels such as
    // "1080p WEB-DL". The ID route is the identity evidence; a readable
    // but strongly conflicting title is still rejected.
    const meaningfulTitleTokens=identityCleanCandidateTitle(titleTexts[0]||"").split(" ").filter(Boolean);
    if(title.score<38&&meaningfulTitleTokens.length>=2){

    }

  }
  score=Math.max(0,Math.min(100,Math.round(score)));
  const threshold=Number(options.threshold||85);
  const accepted=score>=threshold;
  const verdict=score>=95?"exact":accepted?"verified":score>=65?"possible":"rejected";
  return {score,verdict,accepted,hardReject:false,reasons,matchedTitle:title.matchedTitle||identity.title,candidateIds:ids,episodeInfo,threshold};
}

async function cinemetaFetch(url){
  const hit = cinemetaCache.get(url);
  if(hit && Date.now()-hit.t < 300000) return hit.data;
  const fetchJson = async(target, timeoutMs)=>{
    const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), timeoutMs);
    try{
      const r = await fetch(target, {signal: ctl.signal, headers:{Accept:"application/json"}});
      if(!r.ok) throw new Error("HTTP "+r.status);
      return await r.json();
    } finally { clearTimeout(to); }
  };
  let data;
  try{ data = await fetchJson(url, 9000); }
  catch(directErr){
    // Online launches without a bundled TMDB env key can still reach the
    // keyless catalogue through this deployment's own JSON relay if the
    // browser/network cannot reach Cinemeta directly.
    data = await fetchJson("/api/extract?mode=json&url=" + encodeURIComponent(url), 12000);
  }

  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),10000); const t0=performance.now();
  try{ const r=await fetch(url,{headers:{Range:"bytes=0-"+(bytes-1)},signal:ctl.signal,credentials:"omit"});
    if(r.status!==206){ try{ if(r.body) await r.body.cancel(); }catch{} return {ok:false,ms:performance.now()-t0,got:0,rangeIgnored:true}; }
    if(r.body){ const rd=r.body.getReader(); let got=0; while(got<bytes){ const part=await rd.read(); if(part.done) break; got+=part.value.length; if(got>=bytes) break; } try{ await rd.cancel(); }catch{} return {ok:true,ms:performance.now()-t0,got}; }
    return {ok:r.ok,ms:performance.now()-t0,got:0};
  }catch{ return {ok:false,ms:performance.now()-t0,got:0}; } finally{ clearTimeout(to); }
}

function cleanArtworkUrl(raw,kind){

async function artworkFetchJson(url,opts){

    const ctl=typeof AbortController==="function"?new AbortController():null;

    try{
      const init={signal:ctl?ctl.signal:undefined,credentials:"omit",cache:"force-cache",headers:Object.assign({Accept:"application/json"},opts.headers||{})};
      if(opts.method) init.method=opts.method;
      if(opts.body!=null) init.body=opts.body;
      const response=await fetch(target,init);
      if(!response.ok){ const err=new Error("HTTP "+response.status); err.status=response.status; throw err; }
      return await response.json();
    }finally{ if(timer) clearTimeout(timer); }
  };
  try{ return await request(url); }
  catch(err){
    if((!opts.method||opts.method==="GET")&&typeof location!=="undefined"&&/^https?:$/.test(location.protocol)&&!/^\/api\//.test(url)){
      return await request("/api/extract?mode=json&url="+encodeURIComponent(url));
    }
    throw err;
  }
}

  const countries=[...(Array.isArray(item.origin_country)?item.origin_country:[]),item.country||""].join(" ").toUpperCase();
  const language=String(item.original_language||item.language||"").toLowerCase();
  if(ids.includes(16)&&(language==="ja"||countries.includes("JP"))) return true;
  if(/\banime\b/.test(genreNames)) return true;
  return ids.includes(16)&&!language&&!countries;
}
async function artworkFromAnilist(item){
  if(!artworkSetting("anilist")||!artworkLooksAnime(item)) return undefined;
  const title=titleOf(item);
  if(!title||/^title$/i.test(title)) return null;
  const year=Number(yearOf(item)||item.year)||null;
  const query="query ($search:String,$year:Int){Page(page:1,perPage:6){media(search:$search,seasonYear:$year,type:ANIME,sort:SEARCH_MATCH){id format seasonYear startDate{year} title{romaji english native} synonyms coverImage{extraLarge large medium} bannerImage}}}";
  const run=async variables=>{
    const data=await artworkFetchJson("https://graphql.anilist.co",{method:"POST",timeoutMs:10000,headers:{"Content-Type":"application/json"},body:JSON.stringify({query,variables})});
    if(data&&Array.isArray(data.errors)&&data.errors.length) throw new Error(data.errors[0].message||"AniList error");
    return data&&data.data&&data.data.Page&&Array.isArray(data.data.Page.media)?data.data.Page.media:[];
  };
  try{
    let rows=await run({search:title,year});
    if(!rows.length&&year) rows=await run({search:title,year:null});
    const media=rows.find(candidate=>{
      const names=[candidate.title&&candidate.title.english,candidate.title&&candidate.title.romaji,candidate.title&&candidate.title.native,...(Array.isArray(candidate.synonyms)?candidate.synonyms:[])];
      const years=[candidate.seasonYear,candidate.startDate&&candidate.startDate.year];
      return artworkCandidateMatches(names,years,item);
    });
    if(!media) return null;
    const cover=media.coverImage||{};
    return sanitizeArtworkResult({
      poster:tvPerformanceEnabled()?(cover.large||cover.medium||cover.extraLarge||""):(cover.extraLarge||cover.large||cover.medium||""),
      backdrop:media.bannerImage||"",
      provider:"AniList"
    })||null;
  }catch{ return undefined; }
}
async function artworkFromItunes(item){

function mergeArtworkResults(base,candidate){
  const cleanBase=sanitizeArtworkResult(base)||{poster:"",backdrop:"",logo:"",provider:"",providers:[],imdb:""};
  const cleanCandidate=sanitizeArtworkResult(candidate);
  if(!cleanCandidate) return sanitizeArtworkResult(cleanBase);
  if(!cleanBase.poster&&cleanCandidate.poster) cleanBase.poster=cleanCandidate.poster;
  if(!cleanBase.backdrop&&cleanCandidate.backdrop) cleanBase.backdrop=cleanCandidate.backdrop;
  if(!cleanBase.logo&&cleanCandidate.logo) cleanBase.logo=cleanCandidate.logo;
  if(!cleanBase.imdb&&cleanCandidate.imdb) cleanBase.imdb=cleanCandidate.imdb;
  const providers=[];
  [...(cleanBase.providers||[]),...(cleanCandidate.providers||[])].forEach(name=>{ if(name&&!providers.includes(name)) providers.push(name); });
  cleanBase.providers=providers;
  cleanBase.provider=providers[0]||cleanCandidate.provider||"catalogue";
  cleanBase.updatedAt=Date.now();
  return sanitizeArtworkResult(cleanBase);
}
function applyArtworkToItem(item,art){

}
function persistArtworkSnapshot(item,art){
  if(!item||!art) return;
  const type=typeOf(item), id=Number(item.id), key=keyOf(type,id);
  const update=snapshot=>{
    if(!snapshot||Number(snapshot.id)!==id||(snapshot.type||snapshot.media_type)!==type) return false;
    let changed=false;
    if(art.poster&&snapshot.poster_url!==art.poster){ snapshot.poster_url=art.poster; changed=true; }
    if(art.backdrop&&snapshot.backdrop_url!==art.backdrop){ snapshot.backdrop_url=art.backdrop; changed=true; }
    if(art.logo&&snapshot.logo_url!==art.logo){ snapshot.logo_url=art.logo; changed=true; }
    if(art.imdb&&!snapshot.imdb_id){ snapshot.imdb_id=art.imdb; changed=true; }
    if(art.provider) snapshot.artwork_provider=art.providers&&art.providers.length?art.providers.join(" + "):art.provider;
    return changed;
  };
  if(progress&&progress[key]&&update(progress[key])) saveProgress();
  let watchChanged=false;
  if(Array.isArray(watchlist)) watchlist.forEach(snapshot=>{ if(update(snapshot)) watchChanged=true; });
  if(watchChanged) saveWatchlist();
}
function applyArtworkToDom(item,art){

  $$("img[data-artwork-item]",document).forEach(img=>{
    if(img.dataset.type!==type||img.dataset.id!==id) return;
    const kind=img.dataset.artworkKind||"poster";

    if(!url) return;
    img.dataset.artworkResolved="1";
    img.dataset.artworkMissing="";
    delete img.dataset.artworkFailedUrl;
    if(img.getAttribute("src")!==url){ delete img.dataset.fb; img.src=url; }
  });
}
async function resolveArtwork(item,opts){
  opts=opts||{};
  if(!item||!artworkFallbackEnabled()) return null;
  const key=artworkCacheKey(item);
  if(!key) return null;
  const excludeUrls=new Set([...(opts.excludeUrls||[]),...(opts.failedUrl?[opts.failedUrl]:[])].filter(Boolean).map(url=>cleanArtworkUrl(url,"poster")||String(url)));
  const cached=opts.force?null:cachedArtwork(item,{excludeUrls});
  const direct=artworkFromItem(item,excludeUrls);
  let result=mergeArtworkResults(cached,direct);
  const wantsPoster=opts.poster!==false;
  const wantsBackdrop=opts.backdrop===true||opts.kind==="backdrop";
  if(result&&(!wantsPoster||result.poster)&&(!wantsBackdrop||result.backdrop)){
    applyArtworkToItem(item,result);
    return result;
  }
  if(!opts.force){
    const missing=cachedArtwork(item,{includeMissing:true});
    if(missing&&missing.notFound&&!result) return null;
  }
  const flightKey=key+"|"+(wantsBackdrop?"backdrop":"poster")+"|"+[...excludeUrls].join("|");
  if(artworkInFlight.has(flightKey)) return artworkInFlight.get(flightKey);
  const promise=(async()=>{
    let definitiveMisses=0, providerAttempts=0;
    const providers=[
      ["cinemeta",()=>artworkFromCinemeta(item)],
      ["tvmaze",()=>artworkFromTvmaze(item,{poster:!result||!result.poster,backdrop:wantsBackdrop&&(!result||!result.backdrop)})],
      ["anilist",()=>artworkFromAnilist(item)],
      ["itunes",()=>artworkFromItunes(item)]
    ];
    for(const [name,load] of providers){
      if(!artworkSetting(name)) continue;
      if(result&&(!wantsPoster||result.poster)&&(!wantsBackdrop||result.backdrop)) break;
      providerAttempts++;
      let candidate;
      try{ candidate=await load(); }catch{ candidate=undefined; }
      if(candidate===null){ definitiveMisses++; continue; }
      if(!candidate) continue;
      const needs={poster:wantsPoster&&(!result||!result.poster),backdrop:wantsBackdrop&&(!result||!result.backdrop)};
      candidate=await probeArtworkCandidate(candidate,needs,excludeUrls);
      if(candidate) result=mergeArtworkResults(result,candidate);
      else definitiveMisses++;
    }
    if(result){
      artworkCache[key]=Object.assign({},result,{updatedAt:Date.now(),notFound:false});
      saveArtworkCacheSoon();
      applyArtworkToItem(item,result);
      try{ rememberCatalogItem(item); }catch{}
      persistArtworkSnapshot(item,result);
      applyArtworkToDom(item,result);
      return result;
    }
    if(providerAttempts&&definitiveMisses>=providerAttempts){
      artworkCache[key]={poster:"",backdrop:"",logo:"",provider:"",providers:[],imdb:"",updatedAt:Date.now(),notFound:true};
      saveArtworkCacheSoon();
    }
    return null;
  })();
  artworkInFlight.set(flightKey,promise);
  promise.finally(()=>{ if(artworkInFlight.get(flightKey)===promise) artworkInFlight.delete(flightKey); });
  return promise;
}
function artworkImgAttrs(item,kind,url){

async function resolveArtworkForImage(img){

function pumpArtworkDomQueue(){
  const limit=tvPerformanceEnabled()?1:2;
  while(artworkDomActive<limit&&artworkDomQueue.length){
    const img=artworkDomQueue.shift();
    if(!img||!img.isConnected||img.dataset.artworkResolved) continue;
    artworkDomActive++;
    resolveArtworkForImage(img).catch(()=>{}).finally(()=>{ artworkDomActive=Math.max(0,artworkDomActive-1); pumpArtworkDomQueue(); });
  }
}
function queueArtworkForImage(img,force){
  if(!img||!artworkFallbackEnabled()||img.dataset.artworkResolved) return;
  if(!force&&artworkDomQueued.has(img)) return;
  artworkDomQueued.add(img);
  if(!artworkDomQueue.includes(img)) artworkDomQueue.push(img);
  pumpArtworkDomQueue();
}
function bindArtworkFallbacks(root){
  if(!artworkFallbackEnabled()||typeof document==="undefined") return;
  const images=$$('img[data-artwork-item="1"][data-artwork-missing="1"]',root||document);
  if(!images.length) return;
  if(typeof IntersectionObserver!=="function"){ images.forEach(img=>queueArtworkForImage(img,false)); return; }
  if(!artworkDomObserver){
    artworkDomObserver=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{ if(entry.isIntersecting){ artworkDomObserver.unobserve(entry.target); queueArtworkForImage(entry.target,false); } });
    },{root:null,rootMargin:"320px",threshold:0.01});
  }
  images.forEach(img=>{ if(!artworkDomQueued.has(img)) artworkDomObserver.observe(img); });
}

function trailersAllowed(){
  if(!settings.stream||settings.stream.trailerPreviews===false) return false;
  if(playerState||document.hidden||effectiveSaver()) return false;
  try{ if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return false; }catch{}
  const conn=navigator.connection||{};
  if(conn.saveData||/(^|-)2g$/.test(String(conn.effectiveType||""))) return false;
  return true;
}
function youtubePreviewURL(key,opts){
  opts=opts||{};
  const params=new URLSearchParams({autoplay:"1",mute:opts.sound?"0":"1",controls:"0",disablekb:"1",fs:"0",iv_load_policy:"3",loop:"1",playlist:key,modestbranding:"1",playsinline:"1",rel:"0"});

async function getTrailerKey(item,opts){
  opts=opts||{};
  if(!item||!item.id) return trailerKeyFromData(item);
  const type=typeOf(item), key=keyOf(type,Number(item.id));
  const immediate=trailerKeyFromData(item)||trailerKeyCache.get(key)||"";
  if(immediate){ trailerKeyCache.set(key,immediate); return immediate; }
  if(opts.fetchDetail===false) return "";
  if(trailerFetchCache.has(key)) return trailerFetchCache.get(key);
  const promise=(async()=>{
    try{
      const detail=await tmdb("/"+type+"/"+Number(item.id),{append_to_response:"videos,external_ids"});
      const found=trailerKeyFromData(detail);
      if(found){ trailerKeyCache.set(key,found); rememberCatalogItem(Object.assign({},item,{trailer_key:found})); }
      return found;
    }catch{ return ""; }
  })();
  trailerFetchCache.set(key,promise);
  promise.finally(()=>setTimeout(()=>trailerFetchCache.delete(key),30000));
  return promise;
}
function stopCardPreview(card){
  const target=card||activeCardPreview;
  if(cardPreviewTimer){ clearTimeout(cardPreviewTimer); cardPreviewTimer=null; }
  cardPreviewToken++;
  if(!target){ activeCardPreview=null; return; }
  target.classList.remove("is-previewing");
  const layer=target.querySelector(".trailer-layer");
  if(layer) layer.innerHTML="";
  if(activeCardPreview===target) activeCardPreview=null;
  if(cardPreviewObserver) cardPreviewObserver.disconnect();
}
async function startCardPreview(card,opts){
  opts=opts||{};
  if(!card||!card.isConnected||!trailersAllowed()) return;
  if(activeCardPreview&&activeCardPreview!==card) stopCardPreview(activeCardPreview);
  const token=++cardPreviewToken;
  const item=catalogItemFor(card.dataset.type,card.dataset.id);
  const key=await getTrailerKey(item,{fetchDetail:opts.fetchDetail!==false});
  if(!key||token!==cardPreviewToken||!card.isConnected||card.dataset.previewWanted!=="1"||!trailersAllowed()) return;
  const layer=card.querySelector(".trailer-layer");
  if(!layer) return;
  document.querySelectorAll(".hero-trailer.on").forEach(stopBackdropPreview);
  layer.innerHTML='<iframe title="Trailer preview for '+esc(titleOf(item))+'" src="'+esc(youtubePreviewURL(key))+'" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>';
  card.classList.add("is-previewing");
  activeCardPreview=card;
  if(cardPreviewObserver) cardPreviewObserver.disconnect();
  if("IntersectionObserver" in window){
    cardPreviewObserver=new IntersectionObserver(entries=>{ if(entries[0]&&entries[0].intersectionRatio<0.28) stopCardPreview(card); },{threshold:[0,.28,.6]});
    cardPreviewObserver.observe(card);
  }
}
function scheduleCardPreview(card,delay,opts){
  if(!card) return;
  card.dataset.previewWanted="1";
  if(activeCardPreview&&activeCardPreview!==card) stopCardPreview(activeCardPreview);
  if(cardPreviewTimer) clearTimeout(cardPreviewTimer);
  const effectiveDelay=tvPerformanceEnabled()?Math.max(1600,delay==null?620:Number(delay)||620):(delay==null?620:delay);
  cardPreviewTimer=setTimeout(()=>startCardPreview(card,opts||{}),effectiveDelay);
}
function clearCardPreviewIntent(card){
  if(!card) return;
  delete card.dataset.previewWanted;
  if(activeCardPreview===card||card.classList.contains("is-previewing")) stopCardPreview(card);
  else if(cardPreviewTimer){ clearTimeout(cardPreviewTimer); cardPreviewTimer=null; cardPreviewToken++; }
}
function updateRailProgress(track){
  const bar=track&&track.closest(".rail")?track.closest(".rail").querySelector(".rail-progress i"):null;
  if(!bar||!track) return;
  const max=Math.max(1,track.scrollWidth-track.clientWidth);
  const pct=Math.min(1,Math.max(0,track.scrollLeft/max));
  const width=Math.max(10,(track.clientWidth/Math.max(1,track.scrollWidth))*100);
  bar.style.width=width+"%";
  bar.style.transform="translateX("+(pct*(100-width)/Math.max(1,width)*100)+"%)";
}
function spotlightRailCard(track){
  if(!track||!trailersAllowed()) return;
  const rect=track.getBoundingClientRect();
  if(rect.bottom<70||rect.top>window.innerHeight-40) return;
  const center=rect.left+rect.width/2;
  let best=null,bestScore=Infinity;
  track.querySelectorAll(".poster-card").forEach(card=>{
    const r=card.getBoundingClientRect();
    if(r.right<rect.left||r.left>rect.right) return;
    const score=Math.abs((r.left+r.width/2)-center);
    if(score<bestScore){ bestScore=score; best=card; }
  });
  if(best&&best!==activeCardPreview) scheduleCardPreview(best,240,{fetchDetail:false});
}
function bindRailSpotlights(root){
  (root||document).querySelectorAll(".rail-track").forEach(track=>{
    updateRailProgress(track);
    if(track.dataset.spotlightBound) return;
    track.dataset.spotlightBound="1";
    let timer=null;
    track.addEventListener("scroll",()=>{
      updateRailProgress(track);
      if(activeCardPreview&&track.contains(activeCardPreview)) stopCardPreview(activeCardPreview);
      clearTimeout(timer); timer=setTimeout(()=>spotlightRailCard(track),260);
    },{passive:true});
  });
}

function stopBackdropPreview(container){

  if(container._previewObserver){ container._previewObserver.disconnect(); container._previewObserver=null; }
  container.classList.remove("on"); container.innerHTML=""; container.dataset.playing="";

async function startBackdropPreview(container,item,opts){

    if("IntersectionObserver" in window){

      container._previewObserver.observe(container);

function toggleBackdropPreviewSound(container,item){

function formatTime(sec){

  return h?h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"):m+":"+String(s).padStart(2,"0");

function normalizeQualityLabel(q){
  const s=String(q||"").toUpperCase().replace(/\s+/g,"");
  if(!s||s==="AUTO") return "auto";
  if(/2160|4K|UHD/.test(s)) return "2160p";
  if(/1440/.test(s)) return "1440p";
  if(/1080|FHD/.test(s)) return "1080p";
  if(/720|\bHD\b/.test(s)) return "720p";
  if(/480/.test(s)) return "480p";
  if(/360/.test(s)) return "360p";
  const m=s.match(/(\d{3,4})P?/); return m?m[1]+"p":"source";
}
function qualityHeight(q){ const n=parseInt(normalizeQualityLabel(q),10); return Number.isFinite(n)?n:0; }
function parseQualityFromText(text){
  const m=String(text||"").match(/(2160p|1440p|1080p|720p|480p|360p|4k|uhd|fhd|hd)/i);
  return m?normalizeQualityLabel(m[1]):"source";
}
function normalizeVariant(v,fallback){
  if(!v) return null;
  const url=typeof v==="string"?v:(v.url||v.playUrl||"");
  if(!/^https?:\/\//i.test(url)) return null;
  const base=typeof v==="object"?Object.assign({},v):{};
  base.url=url;
  base.quality=normalizeQualityLabel(base.quality||parseQualityFromText([base.label,base.name,base.sub,url].join(" ")));
  base.label=base.label||base.name||fallback||"Direct stream";
  base.addonName=base.addonName||base.serverName||fallback||"Direct server";
  return base;
}
function sortVariantsForQuality(variants,quality){
  const pref=normalizeQualityLabel(quality||settings.stream.quality||"auto");
  const prefH=pref==="auto"?2160:qualityHeight(pref);
  const unique=new Map();
  for(const raw of (variants||[])){ const v=normalizeVariant(raw); if(v&&!unique.has(v.url)) unique.set(v.url,v); }
  return [...unique.values()].sort((a,b)=>{
    const ah=qualityHeight(a.quality), bh=qualityHeight(b.quality);
    const aPenalty=ah>prefH?(ah-prefH)/100+20:(prefH-ah)/1000;
    const bPenalty=bh>prefH?(bh-prefH)/100+20:(prefH-bh)/1000;
    return aPenalty-bPenalty||(Number(b.seeders)||0)-(Number(a.seeders)||0)||(Number(a.bytes)||0)-(Number(b.bytes)||0);
  });
}
function chooseVariantForQuality(variants,quality,currentUrl){
  const list=sortVariantsForQuality(variants,quality);
  if(!list.length) return null;
  const pref=normalizeQualityLabel(quality||"auto");
  if(pref!=="auto"){
    const exact=list.find(v=>normalizeQualityLabel(v.quality)===pref);
    if(exact&&exact.url!==currentUrl) return exact;
  }
  return list.find(v=>v.url!==currentUrl)||list[0];
}
function variantQualityOptions(variants){
  const seen=new Map();
  (variants||[]).forEach(v=>{ const n=normalizeVariant(v); if(n){ const q=normalizeQualityLabel(n.quality); if(!seen.has(q)) seen.set(q,n); } });
  return [...seen.entries()].sort((a,b)=>qualityHeight(b[0])-qualityHeight(a[0])).map(([q,v])=>({value:q,label:q==="source"?"Source quality":q.replace("2160p","4K 2160p"),variant:v}));
}

function showPlayerChrome(sticky){
  const st=playerState, overlay=document.getElementById("playerOverlay"); if(!st||!overlay) return;

  overlay.classList.toggle("player-paused",paused);

  if(st.chromeTimer) clearTimeout(st.chromeTimer);
  const playingNow=!!(st.playback&&!st.playback.paused&&!st.playback.buffering);
  // On TV the remote focus always sits on a chrome control, so a sticky
  // bar would cover the movie forever. While playing, always schedule
  // the hide; any key press wakes the bar again.
  if(sticky&&!(ANDROID_TV_APP&&playingNow)) return;
  st.chromeTimer=setTimeout(()=>{
    if(playerState!==st) return;
    if(!(st.playback&&!st.playback.paused&&!st.playback.buffering)) return;
    const active=document.activeElement;

async function playerCommand(action,value){

  }

  const state=normalizeFastStreamState(data.state||{});
  fsBridge.lastState=state;
  if(playerState) playerState.fsState=state;
  if(data.event==="ready"){
    fsBridge.ready=true;

  }
  if(!playerState||playerState.trailer) return;
  if(playerState.engine==="faststream-api"||playerState.engine==="faststream-connecting"){
    updatePlaybackUI(state,data.event);

      if(playerState.playback&&playerState.playback.buffering&&!playerState.playback.paused){ playerState.autoHighBufferingSince=playerState.autoHighBufferingSince||Date.now(); }
      else playerState.autoHighBufferingSince=0;
      if(playerState.autoHighBufferingSince&&Date.now()-playerState.autoHighBufferingSince>7000){
        playerState.autoHighBufferingSince=0;
        const sortedLevels=(playerState.levels||[]).slice().sort((a,b)=>(Number(a.height)||0)-(Number(b.height)||0)||(Number(a.bitrate)||0)-(Number(b.bitrate)||0));
        const lvlIdx=sortedLevels.findIndex(l=>String(l.id)===String(playerState.autoHighLevelId));

function primeDirectSafely(url,video,bufferedAhead){

  if(!st||st._primeStartedFor===url||settings.stream.preload==="off"||effectiveSaver()||directMediaKind(url)!=="file") return;
  st._primeStartedFor=url;
  /* The primer accepts only real 206 range responses, uses the configured
     FastStream worker/chunk/budget limits, and cancels as soon as the player
     reaches the configured buffer target. */
  setTimeout(async()=>{
    const cfg=streamCfg(), bufferTarget=Number(cfg.bufferTargetSec)||16;
    if(playerState!==st||!video||video.paused||bufferedAhead()>bufferTarget) return;
    const conn=navigator.connection||{};
    const configuredBudget=Math.round(Number(cfg.primeBudgetMb||2)*1048576);
    const budget=conn.downlink&&conn.downlink<1.5?Math.min(configuredBudget,512*1024):configuredBudget;
    const chunk=Math.round(Number(cfg.primeChunkKb||256)*1024); let off=0,got=0; const t0=performance.now();
    st.primeCtl=new AbortController();
    const worker=async()=>{
      while(off<budget&&playerState===st&&!document.hidden){
        if(bufferedAhead()>bufferTarget) break;
        const start=off; off+=chunk;
        try{
          const r=await fetch(url,{headers:{Range:"bytes="+start+"-"+(start+chunk-1)},signal:st.primeCtl.signal,credentials:"omit"});
          if(r.status!==206){ try{await r.body.cancel();}catch{} break; }
          if(!r.body) break;
          const rd=r.body.getReader(); let local=0;
          for(;;){ const part=await rd.read(); if(part.done) break; local+=part.value.length; got+=part.value.length; if(local>=chunk||got>=budget){ try{await rd.cancel();}catch{} break; } }
          const sec=(performance.now()-t0)/1000; st.prime={mb:got/1048576,mbps:sec>0?(got/1048576)/sec:0}; updatePlayerMeta();
        }catch{ break; }
      }
    };
    await Promise.all(Array.from({length:Math.max(1,Math.min(4,Number(cfg.primeThreads)||2))},()=>worker()));
  },1400);
}

function isEmbedwaveOption(option){
  if(!option) return false;
  const text=String([option.id||"",option.sourceId||"",option.name||"",option.url||""].join(" ")).toLowerCase();
  return text.includes("embedwave");
}
async function failover(reason,opts){
  opts=opts||{};
  const st=playerState; if(!st||st.trailer||st.switching) return false;
  if(!opts.manual&&streamCfg().autoFailover===false){
    toast((reason||"Playback problem")+" — automatic server switching is off. Open Servers to choose another server.","error");
    const stage=document.getElementById("playerStage");
    if(stage&&(opts.frameNeverLoaded||st.engine==="loading")){ stage.innerHTML=playerErrorHTML("This server did not start",(reason||"Playback problem")+" Automatic server switching is off in Settings, so ZeroPlay stayed on this server."); bindPlayerErrorActions(); playerLoading(false); }
    return false;
  }
  st.switching=true;
  try{
    if(st.currentServerOptionId) st.tried.add(st.currentServerOptionId);
    if(st.source) st.tried.add(st.source);
    if(st.url){ st.triedUrls=st.triedUrls||new Set(); st.triedUrls.add(st.url); }
    let options=Array.isArray(st.availableServers)?st.availableServers:[];
    if(!st.availabilityChecked||!options.length){
      toast((reason||"Playback problem")+" — searching only servers with this exact title");
      const ctx=playerContext(st);
      const result=await findTitleServers(ctx,{quick:true,quickTimeoutMs:10000,shouldContinue:()=>playerState===st&&!!st.switching,onUpdate:partial=>{ if(playerState===st){ st.availableServers=partial.options||[]; updatePlayerMeta(); } }});
      if(playerState!==st) return;
      options=result.options||[]; st.availableServers=options; st.availabilityChecked=true;
    }
    const untried=options.filter(o=>o&&!st.tried.has(o.id)&&!(o.sourceId&&st.tried.has(o.sourceId))&&(!(o.url&&st.triedUrls&&st.triedUrls.has(o.url))||(o.variants||[]).some(v=>!st.triedUrls.has(v.url))));
    const allowEmbedwave=!!(opts.allowEmbedwave||opts.manual||streamCfg().embedwaveFailover);
    const next=untried.find(o=>allowEmbedwave||!isEmbedwaveOption(o));
    if(!next){
      const onlyEmbedwave=untried.length&&untried.every(isEmbedwaveOption);
      const message=onlyEmbedwave?"Only Embedwave remains, and automatic Embedwave failover is off. Open Servers if you want to choose it manually.":"No other server returned this exact title.";
      toast((reason||"Playback problem")+" — "+message,"error");
      const stage=document.getElementById("playerStage");
      if(stage&&(opts.frameNeverLoaded||st.engine==="loading"||!st.healthRecorded)){ stage.innerHTML=playerErrorHTML(onlyEmbedwave?"ZeroPlay stopped before Embedwave":"No other server returned this exact title",(reason||"")+" "+message); bindPlayerErrorActions(); playerLoading(false); }
      return false;
    }
    toast((reason||"Switching server")+" — "+next.name+" has this title");
    await playTitleServerOption(next,playerContext(st),{fromPlayer:true,keepTime:true});
    return true;
  }finally{ if(playerState===st) st.switching=false; }
}

  if(typeof discoveryRuntime!=="undefined"&&discoveryRuntime.running&&discoveryRuntime.deferredForPlayback){ discoveryRuntime.deferredForPlayback=false; setTimeout(()=>runDiscoveryCycle("after playback"),3000); }

/* ---------------- downloads + M3U extraction ----------------

   IndexedDB, so Pause and browser restarts resume from stored parts whenever
   the remote file/playlist is still the same. Cross-origin embed players are
   never downloadable from the parent page: ZeroPlay first searches for a
   verified direct file/HLS result for the exact title/episode. */

function downloadProgress(job){

function formatDownloadEta(job){
  if(job.status==="complete") return "Complete";

  const remaining=job.totalBytes>0?Math.max(0,job.totalBytes-(job.downloadedBytes||0)):null;
  if(remaining==null) return "—";
  const seconds=remaining/job.speedBps;
  if(seconds<60) return Math.ceil(seconds)+" sec left";
  if(seconds<3600) return Math.ceil(seconds/60)+" min left";
  return (seconds/3600).toFixed(1)+" hr left";
}

  job._speedBytes=(job._speedBytes||0)+(Number(bytes)||0);
  const elapsed=(now-job._speedStartedAt)/1000;

function sanitizeDownloadName(value){ return String(value||"ZeroPlay download").replace(/[<>:"/\\|?*\u0000-\u001f]/g," ").replace(/\s+/g," ").trim().slice(0,150)||"ZeroPlay download"; }

async function loadDownloadJobs(){

        if(!rec||!rec.id) continue;

function scheduleDownloads(){
  if(!downloadsEnabled()) return;
  loadDownloadJobs().then(()=>{
    const max=Math.max(1,downloadCfg().concurrent||1);
    let active=[...downloadJobs.values()].filter(job=>job.status==="running").length;
    for(const job of sortedDownloadJobs().slice().reverse()){
      if(active>=max) break;
      if(job.status!=="queued") continue;
      active++; void runDownloadJob(job);

  }).catch(()=>{});
}

async function refreshDownloadUrl(job){

async function runDownloadJob(job){

const tvmazeEpisodeArtworkCache=new Map();
function episodeStillInfo(ep,item){
  let raw=ep&&(ep.still_url||ep.thumbnail_url||ep.thumbnail)||"";
  if(!raw&&ep&&ep.still_path) raw=/^https?:\/\//i.test(String(ep.still_path))?String(ep.still_path):IMG+"w300"+ep.still_path;
  const still=cleanArtworkUrl(raw,"backdrop");
  if(still) return {url:still,missing:false};
  const fallback=item?backdropURL(item,"w300"):"";
  return {url:/^data:/i.test(fallback)?phSVG("Episode "+(ep&&ep.episode_number||""),(item&&item.id||9)+(ep&&ep.episode_number||0),640,360):fallback,missing:true};
}
async function fillEpisodeThumbnailsFromTvmaze(box,stateToken,season){
  if(!box||!artworkFallbackEnabled()||!artworkSetting("tvmaze")||!stateToken||!stateToken.data) return;
  const missing=$$('img[data-episode-thumb-missing="1"]',box);
  if(!missing.length) return;
  const item=snapToItem(snap(stateToken.data,"tv"));
  const found=await tvmazeShowForItem(item);
  if(!found.show||detailState!==stateToken||Number(detailState.season)!==Number(season)||!box.isConnected) return;
  const showId=Number(found.show.id);
  if(!showId) return;
  if(!tvmazeEpisodeArtworkCache.has(showId)){
    const promise=(async()=>{
      const rows=await artworkFetchJson("https://api.tvmaze.com/shows/"+showId+"/episodes?specials=1",{timeoutMs:12000});
      const map=new Map();
      (Array.isArray(rows)?rows:[]).forEach(row=>{
        const image=row&&row.image||{};
        const url=cleanArtworkUrl(tvPerformanceEnabled()?(image.medium||image.original||""):(image.original||image.medium||""),"backdrop");
        if(url) map.set(Number(row.season)+":"+Number(row.number),url);
      });
      return map;
    })().catch(()=>new Map());
    tvmazeEpisodeArtworkCache.set(showId,promise);
  }
  const map=await tvmazeEpisodeArtworkCache.get(showId);
  if(detailState!==stateToken||Number(detailState.season)!==Number(season)||!box.isConnected) return;
  for(const img of missing){
    if(!img.isConnected) continue;
    const url=map.get(Number(season)+":"+Number(img.dataset.episodeThumb||0));
    if(url&&await artworkProbeImage(url)){ delete img.dataset.fb; img.dataset.episodeThumbMissing=""; img.src=url; }
  }
}

    if(!detailState||detailState!==stateToken) return;
    box.innerHTML=eps.length?'<div class="ep-list">'+eps.map(ep=>{
      const still=episodeStillInfo(ep,detailState.data);
      return '<div class="ep" data-ep="'+ep.episode_number+'"><button class="ep-main" type="button" data-ep-play="'+ep.episode_number+'" aria-label="Play episode '+ep.episode_number+'"><span class="ep-thumb"><img class="episode-thumb-img" loading="lazy" src="'+esc(still.url)+'" alt="" data-episode-thumb="'+ep.episode_number+'"'+(still.missing?' data-episode-thumb-missing="1"':"")+'><span class="ep-num-badge">'+ep.episode_number+'</span></span><span class="ep-copy"><span class="et">'+esc(ep.name||("Episode "+ep.episode_number))+'</span><br><span class="es">'+esc(ep.air_date||"")+(ep.runtime?" · "+ep.runtime+" min":"")+'</span></span></button>'+(downloadsEnabled()?'<button class="ep-download" type="button" data-ep-download="'+ep.episode_number+'" aria-label="Download episode '+ep.episode_number+'" title="Download this episode">⬇<small>Download</small></button>':"")+"</div>";

    });
    void fillEpisodeThumbnailsFromTvmaze(box,stateToken,season);
  }catch{ box.innerHTML='<div class="status-box error">Could not load episodes.</div>'; }
}

async function loadBrowsePage(){
  if(browseState.loading) return; browseState.loading=true;
  const btn=$("#btnMore"); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Loading…'; }
  const grid=$("#browseGrid");
  try{
    const params={page:browseState.page,sort_by:browseState.sort};
    if(browseState.genre) params.with_genres=browseState.genre;
    if(browseState.rating){ params["vote_average.gte"]=browseState.rating; params["vote_count.gte"]="100"; }
    if(browseState.year){ const k=browseState.type==="tv"?"first_air_date.gte":"primary_release_date.gte"; params[k]=browseState.year+"-01-01"; }
    const filtered=browseState.genre||browseState.year||browseState.rating||browseState.sort!=="popularity.desc";
    const path=filtered?"/discover/"+browseState.type:(browseState.type==="tv"?"/tv/popular":"/movie/popular");
    const d=await tmdb(path,filtered?params:{page:browseState.page});
    browseState.total=d.total_pages||1;
    const seen=new Set(browseState.items.map(i=>i.id));
    const fresh=(d.results||[]).filter(x=>!seen.has(x.id));
    browseState.items.push(...fresh);
    if(grid){ if(browseState.page===1&&!fresh.length) grid.innerHTML='<div class="empty" style="grid-column:1/-1"><h3>Nothing found</h3><p>Try loosening the filters above.</p></div>';
      else { grid.insertAdjacentHTML("beforeend",fresh.map((it,i)=>cardHTML(Object.assign({},it,{media_type:browseState.type}),{index:i})).join("")); bindArtworkFallbacks(grid); } }
    if(btn) btn.style.display=browseState.page>=browseState.total?"none":"";
  }catch{ if(grid&&browseState.page===1) grid.innerHTML='<div class="status-box error" style="grid-column:1/-1">Catalog failed to load. Check your connection, then open Settings to review playback and discovery.</div>'; }
  browseState.loading=false; if(btn){ btn.disabled=false; btn.textContent="Load more"; }
}

    const data=JSON.parse(await file.text());
    const incoming=data&&data.settings&&typeof data.settings==="object"?data.settings:data;
    if(!incoming||typeof incoming!=="object"||Array.isArray(incoming)) throw new Error("That file does not contain ZeroPlay settings");
    const allowed=["source","disabledSources","stream","ui","downloads","artwork","feed","discovery","providers","providerTombstones","customSources","sites","addons","health","dlog"];
    const arrayKeys=new Set(["disabledSources","providers","customSources","sites","addons","dlog"]);
    const objectKeys=new Set(["stream","ui","downloads","artwork","feed","discovery","providerTombstones","health"]);
    const staged={};
    for(const key of allowed){
      if(!Object.prototype.hasOwnProperty.call(incoming,key)) continue;
      const value=incoming[key];
      if(key==="source"&&typeof value!=="string") throw new Error("Imported settings have an invalid default source");
      if(arrayKeys.has(key)&&!Array.isArray(value)) throw new Error("Imported settings have an invalid "+key+" list");
      if(objectKeys.has(key)&&(!value||typeof value!=="object"||Array.isArray(value))) throw new Error("Imported settings have an invalid "+key+" section");
      staged[key]=value;
    }
    for(const [key,value] of Object.entries(staged)) settings[key]=objectKeys.has(key)?Object.assign({},settings[key]||{},value):value;
    for(const key of LEGACY_SETTING_KEYS) delete settings[key];
    streamCfg(); downloadCfg(); saveSettings(); applyInterfaceSettings(); scheduleDiscovery();
    toast("Settings imported","success"); renderSources(true);
  }catch(e){ toast("Settings import failed: "+(e.message||e),"error"); }
}

   The crawler does not blindly add every URL it sees. Each endpoint is first
   identified: What is it? Which protocol/capabilities does it expose? Can it
   search? Which catalogue identifiers does it understand? Does it support
   movies/series/episodes? Only an identified, usable server/addon is
   installed into the provider registry for later playback searches.
   Arbitrary GitHub code is never executed: GitHub projects are inspected for
   declarative manifests/endpoints and remain candidates until a hosted
   endpoint can be identified. */

  if(u.hostname.toLowerCase()==="github.com"&&u.pathname.split("/").filter(Boolean).length>=2) return {url:clean,kind:"github"};
  if(/\/manifest\.json(\?|$)/i.test(clean)) return {url:clean,kind:"manifest"};

async function identifyAndRegisterEndpoint(raw, meta){

  const result={seen:0,added:0,installed:0,identified:0,candidates:0};
  if(c.kind==="github"){
    const parts=new URL(c.url).pathname.split("/").filter(Boolean);
    const repo=await githubApiFetch("https://api.github.com/repos/"+parts[0]+"/"+parts[1]);
    const rec=repo?githubRepoToProvider(repo,meta.from||"seed identification"):providerCandidateFromSeed(c);
    const up=absorbProvider(result,rec,{force:!!meta.force});
    if(up&&discoveryCfg().crawlers.githubProbe!==false) await probeGitHubProvider(up.provider);
    syncInstalledAddonsFromProviders(); saveSettings();
    return up?up.provider:null;
  }
  if(c.kind==="manifest"){
    const rec=await probeManifestUrl(c.url,{id:meta.existingId||"",from:meta.from||"seed identification"});
    if(rec){ const up=absorbProvider(result,rec,{force:!!meta.force}); syncInstalledAddonsFromProviders(); saveSettings(); return up?up.provider:null; }
    const up=absorbProvider(result,providerCandidateFromSeed(c),{force:!!meta.force}); saveSettings(); return up?up.provider:null;
  }
  if(c.kind==="feed"){
    try{ await processFeedUrl(c.url,{from:meta.from||"seed identification"}); }catch(e){ const up=absorbProvider(result,Object.assign(providerCandidateFromSeed(c),{lastError:e.message||String(e)}),{force:!!meta.force}); saveSettings(); return up?up.provider:null; }
    return getProvider(providerIdFor({kind:"feed",endpoint:c.url}));
  }
  if(c.kind==="direct"){
    const up=absorbProvider(result,providerCandidateFromSeed(c),{force:!!meta.force}); saveSettings(); return up?up.provider:null;
  }

  // server, then fall back to identifying it as a searchable website.

    const u=new URL(c.url);
    const guesses=[];
    const addGuess=x=>{ const clean=cleanHttpUrl(x); if(clean&&!guesses.includes(clean)) guesses.push(clean); };
    addGuess(u.href.replace(/\/?$/,"/")+"manifest.json");
    addGuess(u.origin+"/manifest.json");

      const rec=await probeManifestUrl(guess,{id:meta.existingId||"",from:meta.from||"server identification"});
      if(rec){ const up=absorbProvider(result,rec,{force:!!meta.force}); syncInstalledAddonsFromProviders(); saveSettings(); return up?up.provider:null; }
    }

  const site=(settings.sites||[]).find(s=>{ try{return new URL(s.base).hostname.toLowerCase()===new URL(c.url).hostname.toLowerCase();}catch{return false;} });
  if(site){ const up=absorbProvider(result,identifyWebsiteProvider(site,profile,meta.from||"server identification"),{force:!!meta.force}); saveSettings(); return up?up.provider:null; }
  return null;
}

function parseFeedProviders(data){

    for(const key of ["providers","addons","sources","items","servers"]) if(Array.isArray(data[key])) lists.push(data[key]);
  }
  const out=[];
  for(const list of lists){
    for(const e of list){
      if(typeof e==="string"){ out.push({seedUrl:e}); continue; }
      if(!e||typeof e!=="object") continue;
      const manifestUrl=cleanHttpUrl(e.manifestUrl||e.transportUrl||e.transport_url||"");

async function identifyProviderCandidate(provider, result){
  if(!provider||provider.status==="installed") return false;
  const wasInstalled=false;
  provider.lastCheckedAt=Date.now();
  try{
    if(provider.kind==="github-project"){
      if(discoveryCfg().crawlers.githubProbe===false) return false;
      const ok=await probeGitHubProvider(provider);
      if(provider.status==="installed"&&!wasInstalled){ result.installed++; result.identified++; }
      return ok;
    }
    if(provider.manifestUrl){
      const rec=await probeManifestUrl(provider.manifestUrl,{id:provider.id,from:provider.source||"candidate identification",repoUrl:provider.repoUrl||"",stars:provider.stars||0,tags:provider.tags||[]});
      if(rec){
        const before=provider.status;
        Object.assign(provider,rec,{id:provider.id,categories:uniqueStringList([].concat(provider.categories||[],rec.categories||[])),lastCheckedAt:Date.now(),lastError:""});
        if(before!=="installed"&&provider.status==="installed"){ result.installed++; result.identified++; }
        return provider.status==="installed";
      }
      provider.lastError="Manifest could not be identified yet.";
      return false;
    }
    const endpoint=provider.endpoint||provider.base||provider.home||provider.repoUrl;
    if(endpoint){
      const identified=await identifyAndRegisterEndpoint(endpoint,{existingId:provider.id,from:"candidate identification"});
      if(identified&&identified.status==="installed"){ result.installed++; result.identified++; return true; }
    }
  }catch(e){ provider.lastError=e.message||String(e); result.errors.push(provider.name+": "+provider.lastError); }
  return false;
}

  }

    if(!playback||!playback.url) return;
    addOption({
      id:(playback.direct?"direct-route:":"route:")+source.id,

      name:source.name, sourceId:source.id, source, url:playback.url,

  await runTitleChecks(sites,3,async source=>{
    stats.checkedWebsites++;
    const found=await checkWebsiteAvailability(source,richCtx).catch(()=>null);
    if(!found||!found.matched){
      emit(); return;
    }
    stats.matchedWebsites++;
    const direct=sortVariantsForQuality((found.direct||[]).map(url=>({url,addonName:source.name,label:found.pageTitle||found.watchTitle||source.name})),settings.stream.quality);
    if(found.playUrl&&isDirectMedia(found.playUrl)&&!direct.some(v=>v.url===found.playUrl)) direct.unshift(normalizeVariant({url:found.playUrl,addonName:source.name,label:found.pageTitle||source.name},source.name));
    addOption({
      id:"site:"+source.id,
      kind:direct.length&&isDirectMedia(found.playUrl||direct[0].url)?"direct":"site",
      status:"verified", verified:true,
      name:source.name, sourceId:source.id, source, url:found.playUrl||found.watchUrl||found.embed||"",
      variants:direct, activeVariant:direct.find(v=>v.url===found.playUrl)||direct[0]||null,
      identityScore:Number(found.identity&&found.identity.score)||0, identityVerdict:found.identity&&found.identity.verdict||"website identity verified",
      score:70+(Number(found.identity&&found.identity.score)||0)/4,
      evidence:"website returned and identity-verified this title",
    });
  });

  /* 3) Identified addon/direct servers: only servers returning verified
        streams for this exact movie/episode become options, grouped by
        server with their real quality variants. */
  let addonSearchActive=true;
  const runAddons=collectAllStreams(richCtx,{
    maxDirect:opts.maxDirect||40,
    waveSize:opts.quick?10:12,
    shouldContinue:()=>addonSearchActive&&(!opts.shouldContinue||opts.shouldContinue()),
    onProgress:agg=>{
      stats.queriedProviders=agg.queried; stats.totalProviders=agg.totalAddons; stats.identityVerified=agg.identityVerified; stats.identityRejected=agg.identityRejected; stats.torrents=agg.torrents; stats.oversize=agg.oversize; stats.external=agg.external; stats.catalogMatches=agg.catalogMatches;
      for(const group of groupStreamsByServer(agg.direct)) byId.set(group.id,group);

    }
  });

    agg=await Promise.race([runAddons,new Promise(resolve=>setTimeout(()=>{ addonSearchActive=false; resolve(null); },Math.max(5000,Number(opts.quickTimeoutMs)||10000)))]);
    if(!agg) runAddons.catch(()=>{});
  }else agg=await runAddons;

  if(agg){ stats.queriedProviders=agg.queried; stats.identityVerified=agg.identityVerified; stats.identityRejected=agg.identityRejected; stats.torrents=agg.torrents; stats.oversize=agg.oversize; stats.external=agg.external; stats.catalogMatches=agg.catalogMatches; for(const group of groupStreamsByServer(agg.direct)) byId.set(group.id,group); }

  result.agg=agg;
  if(!opts.quick&&!(agg&&agg.aborted)) titleServerCache.set(cacheKey,{t:Date.now(),data:result});
  if(opts.onUpdate){ try{ opts.onUpdate(result); }catch{} }
  return result;
}
