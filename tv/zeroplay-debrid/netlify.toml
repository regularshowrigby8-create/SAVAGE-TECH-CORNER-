# ZeroPlay — Netlify configuration
# Deploy options:
#   A) Drag & drop: drop zeroplay-debrid-netlify.zip (or just index.html) on app.netlify.com/drop
#   B) Git deploy:  point Netlify at this repo with base directory "zeroplay-debrid"
# For the live TMDB catalog add env var TMDB_API_KEY (or TMDB_ACCESS_TOKEN)
# in Site settings → Environment variables. Without it the site still works:
# the keyless Cinemeta catalogue is used automatically. No visitor API key is required.

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Permanent Android TV APK channel (same asset the Vercel /tv.apk redirect serves)
[[redirects]]
  from = "/tv.apk"
  to = "https://github.com/regularshowrigby8-create/SAVAGE-TECH-CORNER-/releases/download/zeroplay-tv-v1.0.3/zeroplay-tv.apk"
  status = 302
  force = true

# API proxies (ZeroPlay-compatible paths)
[[redirects]]
  from = "/api/tmdb"
  to = "/.netlify/functions/tmdb"
  status = 200
  force = true

[[redirects]]
  from = "/api/extract"
  to = "/.netlify/functions/extract"
  status = 200
  force = true

# Shareable deep links → single-file app (JS converts them to hash routes)
[[redirects]]
  from = "/movie/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tv/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/movies"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/series"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/library"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/search"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/categories"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/discover"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/sources"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/configure"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/settings"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/downloads"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https:; frame-src https:; media-src https: blob:; object-src 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=300"
