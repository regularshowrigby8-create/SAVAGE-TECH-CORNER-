[build]
  command = "node web/scripts/build.cjs"
  publish = "web/public"
  functions = "web/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/tmdb"
  to = "/.netlify/functions/tmdb"
  status = 200
  force = true

[[redirects]]
  from = "/movie/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tv/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/movies"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/series"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/library"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/search"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://image.tmdb.org data:; connect-src 'self'; frame-src https://vidstuck.cc https://zxcstream.cc https://embedwave.cc https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
