name: nova guards

# Runs the three guards in nova-tv/guards: anti-dead-button,
# anti-hallucination and anti-false-green. Every check comes from an imported
# tool (see nova-tv/guards/README.md). The APK build is a separate workflow
# (nova-tv-android.yml) and is not affected by this one.
#
# Each guard is its own step and fails honestly: no continue-on-error, no
# `|| true`. Later guards still run after an earlier one fails (`if: always()`
# on the step), so one run shows all three results.

on:
  push:
    branches:
      - main
      - arena/*
    paths:
      - 'nova-tv/**'
      - '.github/workflows/nova-guards.yml'
      - '.github/workflows/nova-tv-android.yml'
      - '.github/workflows/nova-tv-python.yml'
  pull_request:
    paths:
      - 'nova-tv/**'
      - '.github/workflows/nova-guards.yml'
      - '.github/workflows/nova-tv-android.yml'
      - '.github/workflows/nova-tv-python.yml'
  workflow_dispatch:

# contents: write commits the reports back (logs and artifacts have not been
# downloadable through the API from the agent environment, a committed file
# always is). checks: write lets action-junit-report publish its check.
permissions:
  contents: write
  checks: write

concurrency:
  group: nova-guards-${{ github.ref }}
  cancel-in-progress: true

# Explicit bash = `bash --noprofile --norc -eo pipefail`. Without this, GitHub
# runs `bash -e` and a failing command on the left of a pipe is ignored.
defaults:
  run:
    shell: bash

jobs:
  guards:
    name: Dead buttons, hallucinations, false greens
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install guard tools (pinned)
        run: nova-tv/guards/install-tools.sh

      - name: Anti-dead-button guard
        id: dead
        if: always()
        run: nova-tv/guards/anti-dead-button.sh

      - name: Anti-hallucination guard
        id: halluc
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nova-tv/guards/anti-hallucination.sh

      - name: Anti-false-green guard
        id: falsegreen
        if: always()
        run: nova-tv/guards/anti-false-green.sh

      # Independent check that the unit tests really ran: fails when no test
      # results exist, when none passed, or when any failed.
      - name: Unit test results are real (action-junit-report)
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'nova-tv/android/app/build/test-results/**/TEST-*.xml'
          check_name: nova unit tests (guards)
          require_tests: true
          require_passed_tests: true
          fail_on_failure: true
          fail_on_parse_error: true
          include_skipped: true

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nova-pitest-report
          path: nova-tv/android/app/build/reports/pitest/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit guard reports
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "nova-ci"
          git config user.email "nova-ci@users.noreply.github.com"
          git add nova-tv/guards/reports/*.md
          if git diff --cached --quiet; then
            echo "reports unchanged"
            exit 0
          fi
          git commit -m "ci(nova): guard reports for run $GITHUB_RUN_ID"
          git status --short
          # A newer run may have pushed reports meanwhile; this run's reports win.
          git pull --rebase --autostash -X theirs origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
