name: nova guards

# Three guards for Nova: anti-dead-button, anti-hallucination and
# anti-false-green. Each guard is one job, and each check in it is one imported
# tool or upstream action. Nothing here is a script written for this repo: the
# steps are tool invocations plus configuration (nova-tv/guards/*.yml|toml).
# See nova-tv/guards/README.md for the tools, versions and licences.
#
# Every check step fails honestly (no continue-on-error, no `|| true`). Steps
# use `if: !cancelled()` so a failing check does not hide the ones after it;
# the job still fails if any of them failed.

on:
  push:
    branches:
      - main
      - arena/*
    paths:
      - 'nova-tv/**'
      - '.github/workflows/nova-guards.yml'
      - '.github/workflows/nova-tv-android.yml'
      - '.github/workflows/nova-tv-python.yml'
  pull_request:
    paths:
      - 'nova-tv/**'
      - '.github/workflows/nova-guards.yml'
      - '.github/workflows/nova-tv-android.yml'
      - '.github/workflows/nova-tv-python.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-guards-${{ github.ref }}
  cancel-in-progress: true

# Explicit bash = `bash --noprofile --norc -eo pipefail`, so `tool | tee file`
# fails when the tool fails.
defaults:
  run:
    shell: bash

env:
  DETEKT_VERSION: '1.23.8'
  # hamodywe/swallowed has no release or npm package yet; pinned to a commit.
  SWALLOWED_REF: 4501bf3e9aed442c64c00f1f77c0e5c2bb8798b3

jobs:
  dead-button:
    name: Anti-dead-button
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch detekt CLI (detekt/detekt release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$DETEKT_VERSION" --repo detekt/detekt --pattern "detekt-cli-$DETEKT_VERSION-all.jar" --dir nova-tv/guards/.tools

      # Empty bodies, TODO() bodies, unused parameters / members / imports.
      # Rule selection: nova-tv/guards/detekt-dead-code.yml.
      - name: detekt - code that exists but does nothing
        run: >-
          java -jar "nova-tv/guards/.tools/detekt-cli-$DETEKT_VERSION-all.jar"
          --input nova-tv/android/app/src
          --excludes '**/test/**,**/androidTest/**'
          --config nova-tv/guards/detekt-dead-code.yml
          --report md:nova-tv/guards/reports/detekt.md

      - name: Keep report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: guard-report-dead-button
          path: nova-tv/guards/reports/
          if-no-files-found: error

  hallucination:
    name: Anti-hallucination
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      # Every class, function and import the app and its tests use exists.
      - name: Kotlin compiler - app and unit tests, both flavours
        working-directory: nova-tv/android
        run: gradle --no-daemon --console=plain :app:compileTvDebugUnitTestKotlin :app:compileMobileDebugUnitTestKotlin

      # Made-up workflow keys, action inputs, contexts and expression functions.
      # Pipe and exit-status problems are the anti-false-green job's.
      - name: actionlint - workflow keys, inputs, expressions
        if: ${{ !cancelled() }}
        uses: raven-actions/actionlint@v2.2.0
        with:
          version: '1.7.12'
          files: '.github/workflows/nova-tv-android.yml, .github/workflows/nova-tv-python.yml, .github/workflows/nova-guards.yml'
          shellcheck: false
          pyflakes: false

      # Python names that are used but never defined.
      - name: ruff - undefined Python names
        if: ${{ !cancelled() }}
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: '0.17.5'
          src: nova-tv/python
          args: check --isolated --output-format github --select F821,F822,F823,F811,F632,PLE

      # URLs, relative file paths and #anchors cited in Nova's docs exist.
      - name: lychee - links, paths and anchors in docs
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config nova-tv/guards/lychee.toml --root-dir ${{ github.workspace }} nova-tv
          output: nova-tv/guards/reports/lychee.md
          fail: true
          failIfEmpty: true

      - name: Keep report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: guard-report-hallucination
          path: nova-tv/guards/reports/
          if-no-files-found: error

  false-green:
    name: Anti-false-green
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # checks: write lets action-junit-report publish its check run.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Fetch swallowed (hamodywe/swallowed)
        uses: actions/checkout@v7
        with:
          repository: hamodywe/swallowed
          ref: ${{ env.SWALLOWED_REF }}
          path: nova-tv/guards/.tools/swallowed
          persist-credentials: false

      # swallowed ships TypeScript sources; Node 24 runs them directly.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # CI steps that verify something and cannot fail: continue-on-error,
      # `|| true`, pipes in a shell without pipefail. Jobs of non-Nova
      # workflows are left out with --ignore.
      - name: swallowed - CI steps that cannot fail
        run: >-
          node nova-tv/guards/.tools/swallowed/src/cli.ts .
          --ignore conveyor_belt --ignore dual_code_review --ignore debug-agents --ignore scan-models
          | tee nova-tv/guards/reports/swallowed.txt

      - uses: actions/setup-java@v6
        if: ${{ !cancelled() }}
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        if: ${{ !cancelled() }}
        with:
          gradle-version: '8.13'

      - name: Unit tests - both flavours
        if: ${{ !cancelled() }}
        working-directory: nova-tv/android
        run: gradle --no-daemon --console=plain :app:testTvDebugUnitTest :app:testMobileDebugUnitTest

      # Fails when no test results exist, when none passed, or any failed.
      - name: action-junit-report - the tests really ran
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6.7.1
        with:
          report_paths: 'nova-tv/android/app/build/test-results/**/TEST-*.xml'
          check_name: nova unit tests (guards)
          require_tests: true
          require_passed_tests: true
          fail_on_failure: true
          fail_on_parse_error: true
          include_skipped: true

      # PIT breaks the code on purpose; the thresholds in
      # nova-tv/android/app/build.gradle.kts (pitest {}) fail the task when the
      # tests notice too few of the broken versions.
      - name: PIT mutation testing - tests must catch broken code
        if: ${{ !cancelled() }}
        working-directory: nova-tv/android
        run: gradle --no-daemon --console=plain :app:pitestTvDebug

      - name: Keep PIT report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nova-pitest-report
          path: nova-tv/android/app/build/reports/pitest/
          if-no-files-found: warn
          retention-days: 14

      - name: Keep report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: guard-report-false-green
          path: nova-tv/guards/reports/
          if-no-files-found: error

  # Commits the tools' own report files to nova-tv/guards/reports so they can
  # be read without downloading logs or artifacts.
  reports:
    name: Commit tool reports
    needs: [dead-button, hallucination, false-green]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: guard-report-*
          merge-multiple: true
          path: nova-tv/guards/reports

      - uses: EndBug/add-and-commit@v11.1.1
        with:
          add: nova-tv/guards/reports
          message: 'ci(nova): guard reports for run ${{ github.run_id }}'
          default_author: github_actions
          # A newer run may have pushed reports meanwhile; this run's win.
          pull: '--rebase --autostash -X theirs'
          push_attempts: '3'
