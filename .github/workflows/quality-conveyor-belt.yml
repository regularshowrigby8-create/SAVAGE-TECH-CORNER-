name: Comprehensive Quality Conveyor Belt

on:
  push:
    branches:
      - main
      - production
      - arena/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  conveyor_belt:
    name: Conveyor Belt Verification Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node Dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "no package-lock.json in this repository; falling back to npm install"
            npm install
          fi

      - name: Install Python Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r tools/factory/requirements/qa.in
          python -m pip install "androguard>=4.0" coverage cryptography jsonschema pyopenssl

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # GATE 8 verifies an APK this checkout built. Building it here is what makes that gate a real
      # provenance check instead of a check that can only ever fail on a machine without the
      # Android toolchain.
      - name: Build the debug APK that GATE 8 verifies
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::no Android SDK on this runner (ANDROID_HOME unset)"
            exit 1
          fi
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager)
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in $SDK_ROOT"
            exit 1
          fi
          printf 'y\n%.0s' {1..40} | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          cd shell/android_project
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
          cd ../..
          find shell/android_project/app/build/outputs/apk -name '*.apk' -exec sha256sum {} \;

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Vulnerability Audit
        run: npm run audit:security

      - name: Code Quality & Linting
        run: |
          set -euo pipefail
          npm run lint
          npm run format:check

      - name: TypeScript Strict Mode Check
        run: npm run typecheck

      - name: Unit & Integration Tests
        run: npm run test

      - name: Knip Unused Dependencies & Files Audit
        run: npm run knip

      - name: Bundle Size Enforcement
        run: npm run size

      - name: Run Master Quality Gates
        run: bash .claude/scripts/gates.sh

      - name: Execute Interconnected Conveyor Belt
        run: npm run conveyor-belt
