name: Comprehensive Quality Conveyor Belt

on:
  push:
    branches:
      - main
      - production
      - arena/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  conveyor_belt:
    name: Conveyor Belt Verification Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node Dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "no package-lock.json in this repository; falling back to npm install"
            npm install
          fi

      - name: Install Python Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # requirements-gate.txt is what the master gates themselves import (coverage, androguard,
          # cryptography, pyopenssl, jsonschema); qa.in is the QA/backend test toolchain. Both are
          # installed explicitly and neither is allowed to fail.
          python -m pip install -r requirements-gate.txt
          python -m pip install -r tools/factory/requirements/qa.in

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # GATE 8 verifies an APK this checkout built. Building it here is what makes that gate a real
      # provenance check instead of a check that can only ever fail on a machine without the
      # Android toolchain. The preparation is shared with every other workflow that runs the gate.
      - name: Build the debug APK that GATE 8 verifies
        run: bash tools/ci/prepare_android_gate_env.sh

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Vulnerability Audit
        run: npm run audit:security

      # Every check below writes its output to one log as well as to the job log. A hosted runner's
      # raw log is not always retrievable afterwards, so this is what makes a red belt diagnosable
      # instead of a step that says only "exit code 1"; the last step turns the tails into
      # annotations.
      - name: Code Quality & Linting
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/quality.log"
          : > "$LOG"
          npm run lint 2>&1 | tee -a "$LOG"
          npm run format:check 2>&1 | tee -a "$LOG"

      - name: TypeScript Strict Mode Check
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee -a "${RUNNER_TEMP}/quality.log"

      - name: Unit & Integration Tests
        run: |
          set -euo pipefail
          npm run test 2>&1 | tee -a "${RUNNER_TEMP}/quality.log"

      - name: Knip Unused Dependencies & Files Audit
        run: |
          set -euo pipefail
          npm run knip 2>&1 | tee -a "${RUNNER_TEMP}/quality.log"

      - name: Bundle Size Enforcement
        run: |
          set -euo pipefail
          npm run size 2>&1 | tee -a "${RUNNER_TEMP}/quality.log"

      - name: Run Master Quality Gates
        run: |
          set -euo pipefail
          bash .claude/scripts/gates.sh 2>&1 | tee "${RUNNER_TEMP}/gates.log"

      - name: Execute Interconnected Conveyor Belt
        run: |
          set -euo pipefail
          npm run conveyor-belt 2>&1 | tee "${RUNNER_TEMP}/conveyor.log"

      - name: Surface the failure
        if: failure()
        run: |
          set -uo pipefail
          found=0
          for name in gates conveyor quality; do
            LOG="${RUNNER_TEMP}/${name}.log"
            if [ ! -s "$LOG" ]; then continue; fi
            found=1
            # The gate's own failure lines, with a few lines of context: a gate that reports
            # "FAIL" without the reason it rejected something cannot be acted on.
            #
            # The match is tested first and the extraction happens inside that branch, because a
            # `grep` that matches nothing exits 1 - and the runner's shell runs with errexit, so a
            # bare assignment from it ended this step before it printed anything. That is what made
            # a real failure on 2026-10-15 arrive as "Process completed with exit code 1" and nothing
            # else: the reporter was the thing failing.
            pattern='FAIL|ERROR|error|Error|Violation|violation|missing|cannot|Cannot'
            if grep -a -q -E "$pattern" "$LOG"; then
              tail_text=$(grep -a -A 4 -E "$pattern" "$LOG" | tail -n 30)
            else
              tail_text=$(tail -n 20 "$LOG")
            fi
            tail_text=${tail_text//%/%25}
            tail_text=${tail_text//$'\n'/%0A}
            echo "::error title=${name} gate output::${tail_text}"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error title=conveyor belt::no captured output - the failure happened before any check ran"
          fi

  # The offline path, proven by a run rather than only by tests. This job deliberately installs no
  # npm dependencies and sets up nothing but Python: the sealed runtime is standard-library only, and
  # a job that needs nothing from a registry is a job that can prove a machine with no registry can
  # run the component. SEALED_NO_NETWORK=1 switches the component's own outbound calls off, and
  # tools/ci/airgap_judge.py rejects the run unless a role's own artefact records the switch - so a
  # run that quietly reached the network fails here instead of passing as "offline".
  airgapped_sealed_run:
    name: Air-gapped sealed run (SEALED_NO_NETWORK=1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the sealed environment with networking switched off
        run: |
          set -euo pipefail
          bash tools/ci/airgap_run.sh 2>&1 | tee "${RUNNER_TEMP}/airgap.log"
