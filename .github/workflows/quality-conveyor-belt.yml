name: Comprehensive Quality Conveyor Belt

on:
  push:
    branches:
      - main
      - production
      - arena/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  conveyor_belt:
    name: Conveyor Belt Verification Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/factory/requirements/qa.in
          pip install "androguard<4.0" coverage cryptography jsonschema pyopenssl

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Vulnerability Audit
        # A failing audit MUST fail the belt — no || true anywhere in this workflow.
        run: npm run audit:security

      - name: ESLint
        run: |
          node --version
          npx eslint --version
          npm run lint

      - name: Prettier Format Check
        run: |
          npx prettier --version
          npm run format:check

      - name: TypeScript Strict Mode Check
        run: npm run typecheck

      - name: Unit & Integration Tests
        run: npm run test

      - name: Dependency Usage Audit (unused/undeclared)
        run: npm run audit:deps

      - name: Bundle Size Enforcement
        run: npm run size

      - name: Run Master Quality Gates
        run: bash .claude/scripts/gates.sh

      - name: Execute Interconnected Conveyor Belt
        run: npm run conveyor-belt
