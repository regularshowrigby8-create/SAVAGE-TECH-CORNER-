name: Nova debug artifact inspect

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    name: Print finder debug session evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_RUN_ID: '45437869620'
      ARTIFACT_NAME: nova-finder-debug-session
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download source run artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/nova-inspect
          gh run download "$SOURCE_RUN_ID" --repo "${{ github.repository }}" \
            --name "$ARTIFACT_NAME" --dir /tmp/nova-inspect
          find /tmp/nova-inspect -type f -printf '%p %s bytes\n' | sort

      - name: Print text evidence
        run: |
          set -euo pipefail
          find /tmp/nova-inspect -type f \( -name '*.txt' -o -name '*.json' -o -name '*.md' -o -name '*.log' -o -name '*.xml' \) -print0 |
            sort -z |
            while IFS= read -r -d '' file; do
              echo "===== BEGIN ${file#/tmp/nova-inspect/} ====="
              if [ "$(wc -c < "$file")" -gt 120000 ]; then
                echo "[first 60KB]"
                head -c 60000 "$file"
                echo
                echo "[last 20KB]"
                tail -c 20000 "$file"
              else
                cat "$file"
              fi
              echo "===== END ${file#/tmp/nova-inspect/} ====="
            done
