name: nova-tv Android

# Why this file is at the repository root and not under nova-tv/.github:
# GitHub Actions only reads .github/workflows at the repository root. The
# workflow that previously sat at nova-tv/.github/workflows/ci.yml was therefore
# never registered -- it is absent from /actions/workflows and has never run.
# This one is where Actions actually looks.
#
# This workflow exists to answer one question: does nova-tv's Kotlin compile?
# It has never been compiled anywhere, so nothing about it is known to be valid.
# The first successful run is the milestone; signing and release come after.

on:
  push:
    branches:
      - main
      - arena/*
    paths:
      - 'nova-tv/android/**'
      - '.github/workflows/nova-tv-android.yml'
  pull_request:
    paths:
      - 'nova-tv/android/**'
      - '.github/workflows/nova-tv-android.yml'
  workflow_dispatch:

# write is needed so the failure path can commit its diagnostics; the build
# itself only reads.
permissions:
  contents: write

concurrency:
  group: nova-tv-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and verify nova-tv APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The same Gradle/AGP pairing this repository already builds green in
      # "ZeroPlay Android TV APK" (Gradle 8.7 + AGP 8.5.x), so a failure here is
      # attributable to nova-tv's code rather than to an untried toolchain.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate version catalog
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          p = Path("nova-tv/android/gradle/libs.versions.toml")
          data = tomllib.loads(p.read_text())
          for section in ("versions", "libraries", "plugins"):
              if not data.get(section):
                  raise SystemExit(f"version catalog missing [{section}]")
          print("catalog ok:", len(data["versions"]), "versions,", len(data["libraries"]), "libraries")
          PY

      - name: Assemble debug APK
        working-directory: nova-tv/android
        run: |
          # GitHub's default shell is `bash -e`, so errexit is ON unless turned
          # off explicitly. It is off here so a failing build cannot skip the
          # diagnostics below.
          set +e
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --console=plain > build.log 2>&1
          STATUS=$?
          echo "gradle exit status: $STATUS"
          echo "----- errors -----"
          grep -nE "^e: |error:|FAILURE:|What went wrong" build.log | head -40
          echo "----- tail -----"
          tail -45 build.log
          exit $STATUS

      # Runs after a failed build. Writes the excerpt into the repository itself,
      # because step summaries and log blobs have both proven unreachable through
      # the API from here, and a committed file always is.
      - name: Publish build diagnostics
        if: failure() || cancelled()
        working-directory: nova-tv/android
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/nova-tv/docs/build-diagnostics.md"
          {
            echo "# nova-tv build diagnostics"
            echo
            echo "Written automatically by the \"nova-tv Android\" workflow."
            echo "Run: $GITHUB_RUN_ID  Commit: $GITHUB_SHA"
            echo
            echo "## compiler errors"
            echo '```'
            grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by" build.log 2>/dev/null | head -60
            echo '```'
            echo
            echo "## last 60 lines"
            echo '```'
            tail -60 build.log 2>/dev/null
            echo '```'
          } > "$OUT"
          wc -l "$OUT"

      - name: Commit diagnostics
        if: failure() || cancelled()
        run: |
          set +e
          git config user.name "nova-ci"
          git config user.email "nova-ci@users.noreply.github.com"
          git add nova-tv/docs/build-diagnostics.md
          git commit -m "ci(nova): record build diagnostics for run $GITHUB_RUN_ID"
          git push
          echo "push exit: $?"

      - name: Run unit tests
        working-directory: nova-tv/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee "${{ runner.temp }}/nova-test.log"

      # Lint is a gate, not a report. A UI with accessibility or API-level
      # problems should fail the build rather than ship and be discovered by a
      # viewer with a remote.
      - name: Android lint
        working-directory: nova-tv/android
        run: |
          set +e
          ./gradlew :app:lintDebug --no-daemon --console=plain > lint.log 2>&1
          STATUS=$?
          echo "lint exit: $STATUS"
          grep -nE "Error:|Warning:|errors?, [0-9]+ warnings?" lint.log | head -30
          # Only errors block; warnings are recorded.
          if grep -qE "^.*Error: " lint.log; then
            echo "lint reported errors"
            exit 1
          fi
          exit 0

      # The release build is the one that has never existed. R8 shrinking is
      # where a serialization-based app fails at runtime rather than at compile
      # time, so building it in CI is the only cheap way to find out.
      - name: Assemble release APK (R8)
        working-directory: nova-tv/android
        run: |
          set +e
          ./gradlew :app:assembleRelease --stacktrace --no-daemon --console=plain > release.log 2>&1
          STATUS=$?
          echo "release exit: $STATUS"
          echo "----- errors -----"
          grep -nE "^e: |error:|FAILURE:|What went wrong|R8|Missing class" release.log | head -40
          echo "----- tail -----"
          tail -40 release.log
          exit $STATUS

      # An APK that exists is not an APK that installs. Verify the package, the
      # signature, and the alignment rather than trusting the file name.
      - name: Verify both APKs
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          for apk in nova-tv/android/app/build/outputs/apk/debug/*.apk \
                     nova-tv/android/app/build/outputs/apk/release/*.apk; do
            echo "=== $apk"
            test -f "$apk" || { echo "MISSING: $apk"; exit 1; }
            ls -l "$apk"
            "$BT/aapt2" dump badging "$apk" | head -5
            "$BT/apksigner" verify --print-certs "$apk" | head -6
            "$BT/zipalign" -c -v 4 "$apk" > /dev/null && echo "aligned: yes"
          done

      - name: Summarise artefacts
        run: |
          {
            echo "## nova-tv build"
            echo
            echo "| APK | bytes |"
            echo "|---|---|"
            for f in nova-tv/android/app/build/outputs/apk/*/*.apk; do
              echo "| $(basename "$f") | $(stat -c%s "$f") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nova-build-log
          path: |
            ${{ runner.temp }}/nova-build.log
            ${{ runner.temp }}/nova-test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nova-tv-release-apk
          path: nova-tv/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nova-tv-debug-apk
          path: nova-tv/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
