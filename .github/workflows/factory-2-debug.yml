name: Factory 2 — Single Debug Job

on:
  push:
    branches: [main, production, factory-2, pipeline, arena/**]
  pull_request:
    branches: [main, production, pipeline]
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours — only one job can trigger
  workflow_dispatch:

# ONLY ONE JOB. Never add a second.
jobs:
  debug-agents:
    runs-on: ubuntu-latest
    concurrency:
      group: factory-2-single
      cancel-in-progress: false # Never cancel running; one job at a time
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "androguard<4.0" coverage cryptography jsonschema pyopenssl

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies (conveyor belt runtime)
        run: npm ci || npm install

      - name: Check rules
        run: bash .claude/scripts/gates.sh
      - name: Run agent scripts (each one fails the job on blocking findings)
        run: |
          python3 factory-2/agents/agent_correctness.py
          python3 factory-2/agents/agent_security.py
          python3 factory-2/agents/agent_architecture.py
          python3 factory-2/agents/agent_quality.py
          python3 factory-2/agents/agent_critic.py
          python3 factory-2/agents/agent_model_debugger.py
      - name: "Manager review (fail-closed: REJECTED verdict or missing agent reports fail the job)"
        run: python3 factory-2/manager/guidance.py
      - name: "Run criticism checks (dead code, stubs, dead UI elements — findings fail the job)"
        run: |
          python3 factory-2/criticism/dead_code_check.py
          python3 factory-2/criticism/incomplete_check.py
          python3 factory-2/criticism/dead_buttons_check.py
      - name: External reporting status
        run: |
          echo "::notice::Linear/Notion/Gmail reporting is performed through connected apps with audited comment/page IDs, not simulated here."
          echo "::notice::The previous 'Would create/update/send' echo-only steps were removed: a step that claims it would report but never does is a false green."
