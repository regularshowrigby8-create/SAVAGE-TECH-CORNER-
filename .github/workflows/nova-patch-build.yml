name: Nova patch build

# The one check that cannot be faked: does the patched nova tree compile?
#
# `nova-patch/` is a drop-in patch against `arena/nova-final-debug`. The apply
# step refuses upstream drift rather than overwriting unrelated work or silently
# building an unpatched tree. Both debug flavours compile, run JVM tests, and
# assemble APKs. If compilation fails, a clean baseline checkout is compiled to
# distinguish a patch defect from an existing source-branch defect.
#
# One job, per the repository's own GATE 2 rule.

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Branch the patched app lives on"
        required: false
        default: "arena/nova-final-debug"
  push:
    paths:
      - 'nova-patch/**'
      - 'tools/apply_nova_patch.py'
      - 'tools/test_apply_nova_patch.py'
      - '.github/workflows/nova-patch-build.yml'

permissions:
  # Write, for one reason only: to commit the compiler errors when the build
  # fails. GitHub's log and artifact blobs are unreachable from an agent sandbox
  # (different host, not on the allowlist), but a file committed to the branch
  # always is. The nova-tv workflow already does this for the same reason.
  contents: write

concurrency:
  group: nova-patch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Apply the patch and compile both flavors
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NOVA_SOURCES: ${{ inputs.sources || 'arena/nova-final-debug' }}
    steps:
      - name: Checkout the patch
        uses: actions/checkout@v4

      - name: Test the patch applier
        run: python3 tools/test_apply_nova_patch.py

      - name: Fetch the nova sources
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$NOVA_SOURCES:refs/remotes/origin/nova-src"
          NOVA_SHA=$(git rev-parse --short origin/nova-src)
          echo "NOVA_SHA=$NOVA_SHA" >> "$GITHUB_ENV"
          echo "nova sources: $NOVA_SOURCES @ $NOVA_SHA"
          rm -rf work && mkdir -p work
          git archive origin/nova-src | tar -x -C work
          test -f work/nova-tv/android/gradlew || { echo "no gradlew in $NOVA_SOURCES"; exit 1; }

      - name: Apply the patch (fail on baseline drift)
        run: |
          set -euo pipefail
          # A drifted destination must not be overwritten; compiling the original
          # app after a rejected patch would be a false green.
          python3 tools/apply_nova_patch.py --target work --write 2>&1 | tee apply.log
          grep -E "^\s+[~+] " apply.log | sed 's/^ *//' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Compile both flavors with the patch
        id: patched
        working-directory: work/nova-tv/android
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :app:compileTvDebugKotlin :app:compileMobileDebugKotlin \
            --no-daemon --console=plain --stacktrace > compile.log 2>&1
          STATUS=$?
          echo "--- errors ---"
          grep -nE "^e: |error:|FAILURE:" compile.log | head -60
          echo "--- tail ---"
          tail -30 compile.log
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Compile both flavors WITHOUT the patch
        # Only meaningful if the patched build failed: it separates "this patch
        # broke the build" from "the branch was already broken".
        #
        # Two things this got wrong on its first run, both fixed here:
        #   1. It reused Gradle's incremental output, so the unpatched compile
        #      saw classes that only exist because the patch had just built them.
        #      The baseline is now a separate checkout with its own build dir.
        #   2. It did not say which flavor failed. It does now, because 'the
        #      patched build failed' and 'the branch was already broken' are only
        #      distinguishable if the same flavor is compared.
        if: steps.patched.outputs.status != '0'
        run: |
          set -uo pipefail
          rm -rf baseline && mkdir -p baseline
          git archive origin/nova-src | tar -x -C baseline
          cd baseline/nova-tv/android
          chmod +x gradlew
          ./gradlew :app:compileTvDebugKotlin :app:compileMobileDebugKotlin \
            --no-daemon --console=plain > baseline.log 2>&1
          BASELINE=$?
          echo "unpatched baseline status: $BASELINE"
          if [ "$BASELINE" -eq 0 ]; then
            echo "BASELINE=clean" >> "$GITHUB_ENV"
            echo "The unpatched branch compiles. The failure above is this patch's." 
          else
            echo "BASELINE=broken" >> "$GITHUB_ENV"
            echo "The unpatched branch ALSO fails to compile, so it was already broken:"
            grep -E "^e: " baseline.log | head -20
          fi

      - name: Run the patched unit tests
        id: tests
        if: steps.patched.outputs.status == '0'
        working-directory: work/nova-tv/android
        run: |
          set +e
          ./gradlew :app:testTvDebugUnitTest :app:testMobileDebugUnitTest \
            --no-daemon --console=plain > tests.log 2>&1
          STATUS=$?
          echo "test status: $STATUS"
          grep -nE "^e: |tests? (completed|failed)|FAILED|BUILD" tests.log | tail -40 || true
          exit "$STATUS"

      - name: Assemble both debug APKs
        id: package
        working-directory: work/nova-tv/android
        run: |
          set +e
          ./gradlew :app:assembleTvDebug :app:assembleMobileDebug \
            --no-daemon --console=plain > package.log 2>&1
          STATUS=$?
          grep -nE "^e: |FAILED|FAILURE:|BUILD" package.log | tail -40 || true
          if [ "$STATUS" -ne 0 ]; then exit "$STATUS"; fi
          # One APK is not evidence that both flavours packaged successfully.
          compgen -G 'app/build/outputs/apk/tv/debug/*.apk' >/dev/null || exit 1
          compgen -G 'app/build/outputs/apk/mobile/debug/*.apk' >/dev/null || exit 1

      - name: Upload debug APKs
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: nova-debug-apks
          path: |
            work/nova-tv/android/app/build/outputs/apk/tv/debug/*.apk
            work/nova-tv/android/app/build/outputs/apk/mobile/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Report
        if: always()
        run: |
          {
            echo "## Nova patch build"
            echo
            echo "- sources: \`$NOVA_SOURCES\` @ \`$NOVA_SHA\`"
            echo "- patch files applied: $(grep -cE '^\s+[~+] ' apply.log || echo 0)"
            echo "- compile (patched): **$([ '${{ steps.patched.outputs.status }}' = '0' ] && echo PASS || echo FAIL)**"
            echo "- unit tests: **${{ steps.tests.outcome }}**"
            echo "- debug APK assembly: **${{ steps.package.outcome }}**"
            echo
            if [ '${{ steps.patched.outputs.status }}' != '0' ]; then
              echo "- baseline (unpatched): **${BASELINE:-not-run}**"
              echo
              if [ "${BASELINE:-}" = "broken" ]; then
                echo "> The unpatched branch does not compile either. This failure is **not** attributable to the patch."
              elif [ "${BASELINE:-}" = "clean" ]; then
                echo "> The unpatched branch compiles. The failure is attributable to the patch."
              fi
              echo
              echo '```'
              grep -E "^e: " work/nova-tv/android/compile.log | head -40 || echo "no compiler errors captured"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-patch-build
          path: |
            apply.log
            work/nova-tv/android/compile.log
            baseline/nova-tv/android/baseline.log
            work/nova-tv/android/tests.log
            work/nova-tv/android/package.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish build or test errors into the repository
        # Also run after a failed test or packaging step, whose exit codes are
        # now propagated instead of being masked by the subsequent grep.
        if: always() && (steps.patched.outputs.status != '0' || steps.tests.outcome == 'failure' || steps.package.outcome == 'failure')
        run: |
          set -uo pipefail
          OUT="nova-patch/BUILD-DIAGNOSTICS.md"
          {
            echo "# Nova patch build diagnostics"
            echo
            echo "Written automatically by the \"Nova patch build\" workflow."
            echo
            echo "- run: $GITHUB_RUN_ID"
            echo "- sources: \`$NOVA_SOURCES\` @ \`$NOVA_SHA\`"
            echo "- patched compile status: ${{ steps.patched.outputs.status }}"
            echo "- unit tests: ${{ steps.tests.outcome }}"
            echo "- APK assembly: ${{ steps.package.outcome }}"
            echo
            echo '## compiler errors'
            echo '```'
            grep -E "^e: |FAILURE:|FAILED" work/nova-tv/android/compile.log | head -80 || echo "no compiler errors captured"
            echo '```'
            echo
            echo '## test errors'
            echo '```'
            grep -E '^e: |FAILURE:|FAILED|[0-9]+ tests? completed|What went wrong:' work/nova-tv/android/tests.log | head -100 || echo 'no test errors captured'
            tail -35 work/nova-tv/android/tests.log 2>/dev/null || true
            echo '```'
            echo
            echo '## APK packaging errors'
            echo '```'
            grep -E '^e: |FAILURE:|FAILED|What went wrong:' work/nova-tv/android/package.log | head -60 || echo 'no packaging errors captured'
            tail -25 work/nova-tv/android/package.log 2>/dev/null || true
            echo '```'
            echo
            echo '## applied patch'
            echo '```'
            grep -E "^\s+[~+] " apply.log | head -40 || true
            echo '```'
            echo
            echo '## baseline (unpatched) compile'
            echo '```'
            if [ -f baseline/nova-tv/android/baseline.log ]; then
              tail -20 baseline/nova-tv/android/baseline.log
            else
              echo "not run -- the patched build did not reach the comparison step"
            fi
            echo '```'
          } > "$OUT"
          head -40 "$OUT"

      - name: Commit the diagnostics
        if: always() && (steps.patched.outputs.status != '0' || steps.tests.outcome == 'failure' || steps.package.outcome == 'failure') && !startsWith(github.ref, 'refs/pull/')
        run: |
          set -euo pipefail
          git config user.name "nova-ci"
          git config user.email "nova-ci@users.noreply.github.com"
          git add nova-patch/BUILD-DIAGNOSTICS.md
          if git diff --cached --quiet; then echo "no diagnostics to commit"; exit 0; fi
          git commit -m "ci(nova): patch build diagnostics for run $GITHUB_RUN_ID"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail if the patched build did not compile
        if: steps.patched.outputs.status != '0'
        run: |
          echo "the patched tree did not compile; see the compiler errors above"
          exit 1
