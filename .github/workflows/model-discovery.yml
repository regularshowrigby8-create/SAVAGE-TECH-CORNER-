name: Weekly Model Discovery Scan

on:
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  scan-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Model Finder
        run: |
          python3 factory-2/scripts/model_finder.py --once

      - name: Verify Model Catalog
        run: |
          python3 -c "import json; d = json.load(open('models/free-models.json')); print(f'Total models: {len(d.get(\"offline_coding_models\", [])) + sum(len(p.get(\"models\", [])) for p in d.get(\"providers\", []))}')"
