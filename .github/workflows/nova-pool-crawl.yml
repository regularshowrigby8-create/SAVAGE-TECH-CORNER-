name: Nova pool crawl

# Why this runs here and not on a laptop:
#
# Discovering remote hosts needs the open internet. A developer machine or an
# agent sandbox may be behind an allowlist; a GitHub runner is not. So the two
# crawlers run here, they cache what they find, and the app imports the result.
#
# Two pools, two ceilings:
#   server_pool.json  3000 addon manifests  (tools/server_crawler.py)
#   site_pool.json    3000 streaming sites  (tools/site_crawler.py)
# They are never merged: a manifest is asked for streams, a site is resolved to a
# direct media URL. Mixing them is how an embed host ends up shown as a source
# that cannot play.
#
# A crawl that finds fewer than the target is a SUCCESS with an honest number,
# not a claim of 3000: the number counts candidates that passed search and
# player-marker heuristics, not verified playable or licensed media. An empty
# result is published honestly but the APK verification step then fails.
# A crawler crash, invalid output, or failed publication fails the job.
#
# One job, per the repository's own GATE 2 rule.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Entries per pool"
        required: false
        default: "3000"
      minutes:
        description: "Time budget per crawler"
        required: false
        default: "45"
      probe:
        description: "Title used to verify a site can be searched"
        required: false
        default: "one piece"
  schedule:
    # GitHub runs schedules from the default branch. Hourly runs are serialized
    # per branch; if a crawl is still running, the latest pending run waits.
    - cron: "23 * * * *"
  push:
    paths:
      - 'nova-patch/nova-tv/tools/server_crawler.py'
      - 'nova-patch/nova-tv/tools/site_crawler.py'
      - 'tools/nova_emulator_smoke.py'
      - 'tools/test_nova_emulator_smoke.py'
      - 'tools/nova_prepare_emulator.sh'
      - 'tools/test_nova_prepare_emulator.py'
      - 'tools/verify_nova_apk_pools.py'
      - 'tools/test_verify_nova_apk_pools.py'
      - '.github/workflows/nova-pool-crawl.yml'

permissions:
  contents: write

concurrency:
  # A legacy crawl can still be running the old, broken publisher. The v2
  # publisher is serialized with other v2 runs, but need not wait for that job.
  group: nova-pool-crawl-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawl both pools
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CRAWL_TARGET: ${{ inputs.target || '3000' }}
      # Pushes exercise the full pipeline quickly; scheduled/manual runs use
      # the longer budget. Each budget applies independently to both crawlers.
      CRAWL_MINUTES: ${{ inputs.minutes || (github.event_name == 'push' && '3') || '45' }}
      CRAWL_PROBE: ${{ inputs.probe || 'one piece' }}
      # Provided by Actions; sent only to api.github.com, never to crawled hosts.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the latest pool data for this branch
        uses: actions/checkout@v4
        with:
          # A queued run's triggering SHA may predate the previous crawl's
          # commit; using the branch tip is what makes --merge cumulative.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Self-test both crawlers (offline, no network)
        run: |
          set -euo pipefail
          # Keep generated files OUTSIDE the mirrored patch tree. Otherwise the
          # drift-safe applier sees the logs as unrecorded patch files.
          mkdir -p "$GITHUB_WORKSPACE/crawl-results"
          cd nova-patch/nova-tv/tools
          python3 test_server_crawler.py 2>&1 | tee "$GITHUB_WORKSPACE/crawl-results/server-selftest.log"
          python3 test_site_crawler.py 2>&1 | tee "$GITHUB_WORKSPACE/crawl-results/site-selftest.log"
          # The site crawler has no network in a self-test either; this checks
          # its HTML parsing, template extraction and verification scoring.
          python3 - <<'PY'
          import site_crawler as s
          html = '<form action="/search" method="get"><input name="keyword" type="text"></form>'
          t = s.search_templates(html, "https://a.example/")
          assert any("{q}" in x for x in t), t
          good = '<a href="/watch/one-piece-1">ep</a><a href="/watch/one-piece-2">ep</a><a href="/episode/one-piece-3">3</a> One Piece 1080p'
          assert s.result_score(good, "one piece", "https://a.example/")[0] == 3
          assert s.result_score("<h1>Domain for sale</h1>", "one piece", "https://a.example/") == (0, 0)
          assert s.player_marker('<iframe src="https://player.example/embed/test"></iframe>', "https://a.example/") == 'iframe'
          assert s.page_title("<title>Watch Anime | NineAnime</title>") == "NineAnime"
          print("site_crawler self-test ok")
          PY

      - name: Validate crawl inputs
        run: |
          set -euo pipefail
          [[ "$CRAWL_TARGET" =~ ^[0-9]{1,4}$ ]] && (( 10#$CRAWL_TARGET >= 1 && 10#$CRAWL_TARGET <= 3000 ))
          [[ "$CRAWL_MINUTES" =~ ^[0-9]{1,2}$ ]] && (( 10#$CRAWL_MINUTES >= 1 && 10#$CRAWL_MINUTES <= 50 ))
          [[ -n "$CRAWL_PROBE" ]]

      - name: Crawl addon manifests
        run: |
          set -euo pipefail
          cd nova-patch/nova-tv/tools
          # A 3 means the budget/frontier ended below target; other nonzero
          # statuses are actual errors and must make the job fail.
          seed=()
          [ ! -f ../../pools/server_pool.json ] || seed=(--merge ../../pools/server_pool.json)
          set +e
          python3 server_crawler.py \
            --target "$CRAWL_TARGET" \
            --max-seconds "$(( 10#$CRAWL_MINUTES * 60 ))" \
            "${seed[@]}" \
            --out "$GITHUB_WORKSPACE/crawl-results/server_pool.json" 2>&1 | tee "$GITHUB_WORKSPACE/crawl-results/server-crawl.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          if [[ "${statuses[1]}" != 0 ]]; then exit "${statuses[1]}"; fi
          if [[ "${statuses[0]}" != 0 && "${statuses[0]}" != 3 ]]; then exit "${statuses[0]}"; fi
          python3 - <<'PY'
          import json, os, pathlib
          d = json.loads((pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "crawl-results/server_pool.json").read_text())
          n = len(d["entries"])
          print(f"manifest pool: {n} entries")
          assert 0 < n <= 3000, "the crawler wrote an empty or oversized pool"
          PY

      - name: Crawl streaming sites
        run: |
          set -euo pipefail
          cd nova-patch/nova-tv/tools
          seed=()
          [ ! -f ../../pools/site_pool.json ] || seed=(--merge ../../pools/site_pool.json)
          set +e
          python3 site_crawler.py \
            --target "$CRAWL_TARGET" \
            --probe "$CRAWL_PROBE" \
            --max-seconds "$(( 10#$CRAWL_MINUTES * 60 ))" \
            "${seed[@]}" \
            --manifests "$GITHUB_WORKSPACE/crawl-results/server_pool.json" \
            --out "$GITHUB_WORKSPACE/crawl-results/site_pool.json" 2>&1 | tee "$GITHUB_WORKSPACE/crawl-results/site-crawl.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          if [[ "${statuses[1]}" != 0 ]]; then exit "${statuses[1]}"; fi
          if [[ "${statuses[0]}" != 0 && "${statuses[0]}" != 3 ]]; then exit "${statuses[0]}"; fi
          python3 - <<'PY'
          import json, os, pathlib
          import site_crawler as site
          d = json.loads((pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "crawl-results/site_pool.json").read_text())
          n = len(d["entries"])
          rejected = d.get("rejected", {})
          pending = d.get("pending_recheck", [])
          print(f"site pool: {n} passed the current heuristic, {len(pending)} pending recheck, rejected {sum(rejected.values())}")
          print("rejected by reason:", rejected)
          assert n <= 3000, "the crawler wrote an oversized site pool"
          assert d.get("verification_method") == site.VERIFICATION_METHOD
          bad = [e for e in d["entries"]
                 if not site.verification_is_current(e.get("verification"))
                 or not any("{q}" in t or "{slug}" in t for t in e.get("templates", []))]
          assert not bad, f"{len(bad)} entries lack current verification or a query placeholder"
          PY

      - name: Merge any pools published while this run was crawling
        run: |
          set -euo pipefail
          # Another (older) run may finish while this one crawls. Rebase before
          # copying the untracked output files, then union both distinct pools.
          git fetch -q origin "${GITHUB_REF_NAME}"
          git rebase FETCH_HEAD
          python3 - <<'PY'
          import json, pathlib, sys
          from collections import Counter
          tools = pathlib.Path('nova-patch/nova-tv/tools')
          sys.path.insert(0, str(tools))
          import server_crawler as server
          import site_crawler as site
          for name, cls in (('server_pool', server.Pool), ('site_pool', site.SitePool)):
              previous = pathlib.Path('nova-patch/pools') / (name + '.json')
              fresh = pathlib.Path('crawl-results') / (name + '.json')
              if not previous.is_file():
                  continue
              fresh_doc = json.loads(fresh.read_text())
              pool = cls(target=3000)
              pool.merge_file(previous)
              pool.merge_file(fresh)
              if name == 'site_pool':
                  merged = pool.as_document(Counter(fresh_doc.get('rejected', {})), fresh_doc.get('by_source', {}),
                                            fresh_doc.get('source_evidence', {}))
              else:
                  merged = pool.as_document(fresh_doc.get('by_source', {}), fresh_doc.get('source_evidence', {}))
              fresh.write_text(json.dumps(merged, indent=1) + '\n')
              print(f'{name}: preserved {pool.size} entries from both runs')
          PY

      - name: Publish both validated pools and their APK assets
        run: |
          set -euo pipefail
          mkdir -p nova-patch/pools nova-patch/nova-tv/android/app/src/main/assets
          for name in server_pool site_pool; do
            src="crawl-results/$name.json"
            test -s "$src"
            cp "$src" "nova-patch/pools/$name.json"
            cp "$src" "nova-patch/nova-tv/android/app/src/main/assets/$name.json"
            cmp "$src" "nova-patch/nova-tv/android/app/src/main/assets/$name.json"
            echo "published and bundled $name.json ($(wc -c < "$src") bytes)"
          done

      - name: Publish the crawl numbers into the repository
        # The step summary and the artifacts both live on hosts that are not
        # reachable from an agent sandbox, so the numbers that matter are also
        # written into the repo. This is the only way to answer "how many did it
        # actually find" without downloading anything.
        run: |
          set -euo pipefail
          mkdir -p nova-patch/pools
          python3 - <<'PY'
          import json, os, pathlib, time
          out = {"generated": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
          for name in ("server_pool", "site_pool"):
              f = pathlib.Path(f"nova-patch/pools/{name}.json")
              alt = pathlib.Path(f"crawl-results/{name}.json")
              f = f if f.is_file() else alt
              if not f.is_file():
                  out[name] = {"entries": None, "note": "crawler wrote no file"}
                  continue
              d = json.loads(f.read_text())
              entries = d.get("entries", [])
              out[name] = {
                  "entries": len(entries),
                  "ceiling": 3000,
                  "verification_method": d.get("verification_method"),
                  "pending_recheck": len(d.get("pending_recheck", [])),
                  "rejected": d.get("rejected", {}),
                  "by_source": d.get("by_source", {}),
                  "source_evidence": d.get("source_evidence", {}),
              }
          lines = ["# Nova pool crawl", "", "| pool | entries | ceiling |", "|---|---|---|"]
          for name in ("server_pool", "site_pool"):
              info = out[name]
              lines.append(f"| {name}.json | {info.get('entries')} | 3000 |")
          site = out.get("site_pool", {})
          lines += ["", f"Site verification method: `{site.get('verification_method')}`; "
                        f"legacy candidates awaiting recheck: {site.get('pending_recheck', 0)}.",
                    "These checks do not establish playback or licensing."]
          if site.get("rejected"):
              lines += ["", "## Sites dropped, by reason", ""]
              for reason, count in sorted(site["rejected"].items(), key=lambda kv: -kv[1]):
                  lines.append(f"- {count:5d}  {reason}")
          for name in ("server_pool", "site_pool"):
              evidence = out[name].get("source_evidence", {})
              if evidence:
                  lines += ["", f"## {name} source evidence (this run)", "",
                            "| source | page attempts | page failures | candidates | new entries |", "|---|---:|---:|---:|---:|"]
                  for src, counts in sorted(evidence.items()):
                      label = str(src).replace('|', r'\|')
                      lines.append(f"| {label} | {counts.get('pages_requested', 0)} | {counts.get('pages_failed', 0)} | {counts.get('candidates', 0)} | {counts.get('added', 0)} |")
          lines += ["", "Counts reflect the configured sources and time budget, not internet-wide exhaustion.",
                    "", f"_generated {out['generated']} by run {os.environ.get('GITHUB_RUN_ID', 'unknown')}_", ""]
          pathlib.Path("nova-patch/POOL-COUNTS.md").write_text("\n".join(lines))
          pathlib.Path("nova-patch/pools/counts.json").write_text(json.dumps(out, indent=1))
          print("\n".join(lines[:8]))
          PY

      # The JSON, counts, and both APK assets must be one commit. A failed
      # push is a failed job, not a green run that silently loses the crawl.
      - name: Commit the pools, counts and assets
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/pull/')
        run: |
          set -euo pipefail
          git config user.name "nova-crawler"
          git config user.email "nova-crawler@users.noreply.github.com"
          git add nova-patch/pools nova-patch/POOL-COUNTS.md \
            nova-patch/nova-tv/android/app/src/main/assets/server_pool.json \
            nova-patch/nova-tv/android/app/src/main/assets/site_pool.json
          if git diff --cached --quiet; then
            echo "pool data unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "data(nova): refresh both pools, $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git rebase FETCH_HEAD
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "::error::could not push the pool data after three attempts"
          exit 1

      # A push made with GITHUB_TOKEN does not trigger another push workflow.
      # Build here, after publishing, so the produced APKs actually contain this
      # run's pools instead of the empty assets from its checkout.
      - name: Fetch the Nova source checkout
        run: |
          set -euo pipefail
          git fetch --depth=1 origin arena/nova-final-debug:refs/remotes/origin/nova-src 2>&1 | tee crawl-results/source-fetch.log
          mkdir -p work
          git archive origin/nova-src nova-tv | tar -x -C work
          test -f work/nova-tv/android/gradlew

      - name: Test and apply the Nova patch
        run: |
          set -euo pipefail
          python3 tools/test_apply_nova_patch.py 2>&1 | tee crawl-results/apply-tests.log
          python3 tools/apply_nova_patch.py --target work --write 2>&1 | tee crawl-results/apply.log

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Test and assemble both APKs with the crawled pools
        working-directory: work/nova-tv/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testTvDebugUnitTest :app:testMobileDebugUnitTest \
            :app:assembleTvDebug :app:assembleMobileDebug --no-daemon --console=plain 2>&1 | tee crawl-build.log

      - name: Test the APK pool verifier
        run: python3 tools/test_verify_nova_apk_pools.py

      - name: Verify both APKs contain the current pool assets
        id: apk_verify
        run: |
          set -euo pipefail
          # Even with zero checked sites we can test the crash path, but that
          # APK is not eligible for distribution as a fully populated build.
          python3 tools/verify_nova_apk_pools.py \
            --assets nova-patch/nova-tv/android/app/src/main/assets \
            --tv work/nova-tv/android/app/build/outputs/apk/tv/debug/*.apk \
            --mobile work/nova-tv/android/app/build/outputs/apk/mobile/debug/*.apk \
            --allow-empty-sites-for-smoke 2>&1 | tee crawl-results/apk-verification.log

      - name: Test the emulator smoke checker
        run: python3 tools/test_nova_emulator_smoke.py

      - name: Check emulator acceleration
        id: acceleration
        run: |
          set -euo pipefail
          # Some hosted runners have no /dev/kvm, or cannot reload udev. Do
          # not skip the smoke test just because the permission setup failed:
          # android-emulator-runner's `auto` mode uses software in that case.
          # The mode is recorded; a boot timeout or failed smoke is still a
          # job failure, never a pass for an unavailable emulator.
          {
            echo "Runner: $(uname -a)"
            if [ -e /dev/kvm ]; then
              ls -l /dev/kvm
              if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
                if sudo chmod a+rw /dev/kvm; then
                  echo 'Adjusted /dev/kvm permissions on this ephemeral runner.'
                else
                  echo 'Could not adjust /dev/kvm permissions.'
                fi
              fi
            else
              echo '/dev/kvm is absent.'
            fi
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo 'Acceleration mode: KVM'
              echo 'mode=kvm' >> "$GITHUB_OUTPUT"
            else
              echo 'Acceleration mode: software fallback (may be slow)'
              echo 'mode=software' >> "$GITHUB_OUTPUT"
            fi
          } 2>&1 | tee crawl-results/emulator-acceleration.log

      - name: Test emulator image preparation (offline)
        run: python3 tools/test_nova_prepare_emulator.py

      - name: Prepare the Android TV emulator image
        run: |
          set -euo pipefail
          # Capture SDK/download failures rather than losing them inside the
          # third-party emulator action. The helper retries bounded failures.
          bash tools/nova_prepare_emulator.sh 2>&1 | tee crawl-results/emulator-sdk.log

      - name: Observe both flavors after server finding starts
        id: emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-linux-hw-accel: auto
          # Software boot can take much longer than an accelerated boot.
          emulator-boot-timeout: 1200
          disable-animations: true
          # This marker distinguishes SDK/AVD setup failures from boot failures.
          pre-emulator-launch-script: echo 'SDK installation and AVD creation completed; boot was attempted.' > crawl-results/emulator-prelaunch.log
          # The action runs each script line in a separate POSIX shell.
          script: python3 tools/nova_emulator_smoke.py --tv work/nova-tv/android/app/build/outputs/apk/tv/debug/*.apk --mobile work/nova-tv/android/app/build/outputs/apk/mobile/debug/*.apk --out emulator-results --seconds 90

      - name: Require nonempty checked pools for distribution
        id: distribution
        run: |
          set -euo pipefail
          python3 tools/verify_nova_apk_pools.py \
            --assets nova-patch/nova-tv/android/app/src/main/assets \
            --tv work/nova-tv/android/app/build/outputs/apk/tv/debug/*.apk \
            --mobile work/nova-tv/android/app/build/outputs/apk/mobile/debug/*.apk \
            2>&1 | tee crawl-results/apk-distribution-check.log

      - name: Upload APKs with both crawled pools
        uses: actions/upload-artifact@v4
        with:
          name: nova-crawled-debug-apks
          path: |
            work/nova-tv/android/app/build/outputs/apk/tv/debug/*.apk
            work/nova-tv/android/app/build/outputs/apk/mobile/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK pool verification outcome
        if: always() && !startsWith(github.ref, 'refs/pull/')
        env:
          APK_VERIFY_OUTCOME: ${{ steps.apk_verify.outcome }}
          DISTRIBUTION_OUTCOME: ${{ steps.distribution.outcome }}
        run: |
          set -euo pipefail
          {
            echo '# Nova APK pool verification'
            echo
            echo "Run: $GITHUB_RUN_ID"
            echo
            echo "- Byte-for-byte asset check: ${APK_VERIFY_OUTCOME:-not started}"
            echo "- Nonempty distribution gate: ${DISTRIBUTION_OUTCOME:-not started}"
            echo
            echo '```'
            if [ -f crawl-results/apk-verification.log ]; then cat crawl-results/apk-verification.log; else echo 'Asset check did not complete.'; fi
            if [ -f crawl-results/apk-distribution-check.log ]; then cat crawl-results/apk-distribution-check.log; fi
            echo '```'
          } > nova-patch/APK-VERIFICATION.md
          git config user.name "nova-ci"
          git config user.email "nova-ci@users.noreply.github.com"
          git add nova-patch/APK-VERIFICATION.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci(nova): APK pool verification for run $GITHUB_RUN_ID"
          git fetch -q origin "$GITHUB_REF_NAME"
          git rebase FETCH_HEAD
          git push -q origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish the emulator outcome
        if: always() && !startsWith(github.ref, 'refs/pull/')
        env:
          EMULATOR_OUTCOME: ${{ steps.emulator.outcome }}
        run: |
          set -euo pipefail
          if [ -s emulator-results/summary.md ]; then
            cp emulator-results/summary.md nova-patch/EMULATOR-SMOKE.md
            printf '\nRun: %s\n' "$GITHUB_RUN_ID" >> nova-patch/EMULATOR-SMOKE.md
          else
            printf '# Nova emulator startup smoke\n\nRun: %s\n\nNOT COMPLETED (emulator step: %s).\n' \
              "$GITHUB_RUN_ID" "${EMULATOR_OUTCOME:-not started}" > nova-patch/EMULATOR-SMOKE.md
          fi
          for f in crawl-results/emulator-acceleration.log crawl-results/emulator-sdk.log crawl-results/emulator-prelaunch.log; do
            [ -s "$f" ] || continue
            printf '\n## %s\n\n```\n' "$f" >> nova-patch/EMULATOR-SMOKE.md
            tail -30 "$f" >> nova-patch/EMULATOR-SMOKE.md
            printf '```\n' >> nova-patch/EMULATOR-SMOKE.md
          done
          git config user.name "nova-ci"
          git config user.email "nova-ci@users.noreply.github.com"
          git add nova-patch/EMULATOR-SMOKE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci(nova): emulator smoke outcome for run $GITHUB_RUN_ID"
          git fetch -q origin "$GITHUB_REF_NAME"
          git rebase FETCH_HEAD
          git push -q origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish crawl failure diagnostics
        if: failure() && !startsWith(github.ref, 'refs/pull/')
        run: |
          set -euo pipefail
          OUT=nova-patch/CRAWL-DIAGNOSTICS.md
          {
            echo '# Nova crawl failure diagnostics'
            echo
            echo "Run: $GITHUB_RUN_ID"
            echo
            for f in crawl-results/server-selftest.log \
                     crawl-results/site-selftest.log \
                     crawl-results/server-crawl.log \
                     crawl-results/site-crawl.log \
                     crawl-results/source-fetch.log \
                     crawl-results/apply-tests.log \
                     crawl-results/apply.log \
                     crawl-results/apk-verification.log \
                     crawl-results/apk-distribution-check.log \
                     crawl-results/emulator-acceleration.log \
                     crawl-results/emulator-sdk.log \
                     crawl-results/emulator-prelaunch.log \
                     work/nova-tv/android/crawl-build.log; do
              [ -f "$f" ] || continue
              echo "## $f"
              echo '```'
              tail -80 "$f"
              echo '```'
              echo
            done
          } > "$OUT"
          git config user.name "nova-ci"
          git config user.email "nova-ci@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci(nova): crawl diagnostics for run $GITHUB_RUN_ID"
          git fetch -q origin "$GITHUB_REF_NAME"
          git rebase FETCH_HEAD
          git push -q origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload crawl outputs and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-pools
          path: |
            crawl-results/
            nova-patch/POOL-COUNTS.md
            nova-patch/CRAWL-DIAGNOSTICS.md
            nova-patch/APK-VERIFICATION.md
            nova-patch/EMULATOR-SMOKE.md
            emulator-results/
            work/nova-tv/android/crawl-build.log
          if-no-files-found: warn
          retention-days: 14
