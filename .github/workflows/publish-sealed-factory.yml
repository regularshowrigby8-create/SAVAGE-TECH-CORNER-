name: Publish Sealed Factory (own branch)

# The sealed component is published to a branch of its own - never to main. The gates are in the order
# that makes that safe: the seal verifies, the component rechecks itself with the factories it carries
# and repairs what it can, its own tests pass, and then the exact tree that is about to be pushed proves
# itself again inside the branch worktree. Nothing is written to the branch before all of that passes.
#
# Why a workflow and not a person: this repository's rules require a clean checkout, evidence from a
# run, and no hand-pushed branch. A publish is an operation with an order to it, and an order belongs in
# something that runs the same way every time.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - production
      - arena/**
    paths:
      - ".github/workflows/publish-sealed-factory.yml"
      - "tools/ci/publish_sealed_factory.sh"
      - "tools/ci/build_component_snapshot.py"
      - "sealed-factories/runtime/selfcheck.py"

permissions:
  contents: write

concurrency:
  group: publish-sealed-factory
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, self-check, and publish the component to its own branch
    runs-on: ubuntu-latest
    env:
      PUBLISH_BRANCH: sealed-factory
      BRANCH_SOURCE: ${{ github.ref_name }}
    steps:
      - name: Checkout the branch under review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The component's runtime is standard-library only, and so is this job: it installs nothing, which
      # is the same claim the air-gapped run makes - a branch that can be published by a machine with no
      # registry is a branch that can be published anywhere.
      - name: Verify, recheck, re-verify in the published tree, and publish
        run: |
          set -euo pipefail
          bash tools/ci/publish_sealed_factory.sh

      - name: Publish the summary of what was published
        if: success()
        run: |
          set -euo pipefail
          {
            echo "### Sealed factory published to \`sealed-factory\`"
            echo
            echo "The component verified, rechecked itself with the factories it carries, passed its"
            echo "own tests, and proved itself again inside the published tree."
            echo
            echo "This branch does not touch \`main\`: the component is proposed for main only once"
            echo "this branch's evidence says it is functional."
          } >> "$GITHUB_STEP_SUMMARY"

      # Which gate refused, by name: the run writes its current gate to a file before it runs, and this
      # step reads it. "A step failed" is not a reason anyone can act on - the lesson from the belt's own
      # failure reporter, which used to fail into the log with nothing to show for it.
      - name: Say which gate refused, and that nothing was published
        if: failure()
        run: |
          set -uo pipefail
          gate_file="${RUNNER_TEMP}/publish-gate.txt"
          gate="unknown"
          if [ -s "$gate_file" ]; then gate="$(cat "$gate_file")"; fi
          echo "::error title=Publish sealed factory::the gate '${gate}' refused the component, so nothing was written to the publish branch"
          echo "The branch is unchanged. The gate's own output is annotated above it."
