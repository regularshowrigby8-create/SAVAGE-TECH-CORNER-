# Moved from nova-tv/.github/workflows/ci.yml, where it never ran.
#
# GitHub Actions only reads .github/workflows at the repository ROOT. A workflow
# nested under a subproject is not registered at all -- this file was absent from
# the repo's /actions/workflows list, so the unit tests, the 6-hourly collection
# pass and the secrets scan it defines had never executed once.
#
# Only the working directories change on the way here: the Python project lives
# at nova-tv/python, not at the root.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Continuous collection: the self-updating part, running on GitHub's clock.
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: nova-tv/python
        run: python -m unittest discover -s tests -t . -v
      # Smoke test: every script starts and produces a result. Exit 0 is a
      # pass and 2 is a check that ran and reported a failing verdict (see
      # nova/cli.py); both mean the script executed. 1 (the tool raised) or
      # 124 (timeout) means it did not. Some tools need network access or an
      # AI key the runner does not have, so this reports and does not gate.
      - name: Every script executes
        working-directory: nova-tv/python
        shell: bash
        run: |
          ran=0; failing=0; broken=0
          for f in scripts/*.py; do
            case "$f" in
              *github_watch*) continue ;;   # loops by design
            esac
            status=0
            timeout 120 python "$f" --json > /dev/null 2>&1 || status=$?
            case "$status" in
              0) ran=$((ran+1)) ;;
              2) failing=$((failing+1)); echo "::notice file=nova-tv/python/$f::check ran and failed (exit 2)" ;;
              *) broken=$((broken+1)); echo "::warning file=nova-tv/python/$f::script did not produce a result (exit $status)" ;;
            esac
          done
          echo "scripts passed=$ran failed-check=$failing did-not-run=$broken"
      - name: No committed secrets
        working-directory: nova-tv/python
        run: python scripts/qa_secrets.py --json

  collect:
    name: Collect
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: One collection pass
        working-directory: nova-tv/python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/github_collect.py --json --budget 3 || true
          python scripts/kb_stats.py
      - uses: actions/upload-artifact@v7
        with:
          name: knowledge
          path: nova-tv/knowledge.json
          if-no-files-found: warn
