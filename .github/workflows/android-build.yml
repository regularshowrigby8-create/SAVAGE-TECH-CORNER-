name: Android Shell CI & Release Pipeline

on:
  push:
    branches:
      - main
      - arena/*
    tags:
      - 'v*'
    paths:
      - 'shell/android_project/**'
      - '.github/workflows/android-build.yml'
      - 'tools/vm_crash_and_install_debugger.py'
  pull_request:
    paths:
      - 'shell/android_project/**'
      - '.github/workflows/android-build.yml'
      - 'tools/vm_crash_and_install_debugger.py'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android Shell
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python for VM Diagnostics
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python VM Dependencies
        run: |
          pip install "androguard<4.0" cryptography

      - name: Grant Execute Permission to Gradlew
        run: chmod +x shell/android_project/gradlew

      - name: Clean and Assemble Debug APK
        run: |
          cd shell/android_project
          ./gradlew clean :app:assembleDebug --stacktrace --no-daemon

      - name: Locate Output APK
        id: apk_locator
        run: |
          echo "=== Locating compiled APK in build outputs ==="
          find shell/android_project/app/build/outputs/apk/debug/ -type f -name "*.apk" -ls
          SRC_APK=$(find shell/android_project/app/build/outputs/apk/debug/ -type f -name "*.apk" | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "ERROR: Could not find compiled APK" >&2
            exit 1
          fi

          # Derive asset name from the project version, not a hardcoded constant
          VERSION_NAME=$(grep -oE 'versionName = "[^"]+"' shell/android_project/app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          if [ -z "$VERSION_NAME" ]; then
            echo "ERROR: could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi

          TARGET_DIR="shell/android_project/app/build/outputs/apk/debug"
          NAMED_APK="$TARGET_DIR/SavageBrowser-v${VERSION_NAME}.apk"
          cp "$SRC_APK" "$NAMED_APK"

          # Inspect contents of the compiled APK to verify bytecode and manifest
          echo "=== APK CONTENTS INSPECTION ==="
          unzip -l "$NAMED_APK" | head -n 35

          echo "Found freshly built authentic APK: $NAMED_APK"
          echo "apk_path=$NAMED_APK" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Run Production APK through Android VM Verifier & Diagnostics
        run: |
          echo "=== Executing Android VM Verifier and Crash Diagnostics ==="
          python3 tools/vm_crash_and_install_debugger.py "${{ steps.apk_locator.outputs.apk_path }}" --api 34 --heap 256 2>&1 | tee /tmp/vm_run.log || {
            ERR=$?
            echo "::error::$(head -n 20 /tmp/vm_run.log | tr '\n' ' ')"
            exit $ERR
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SavageBrowser-apk
          path: ${{ steps.apk_locator.outputs.apk_path }}

      - name: Sync Verified APK Into Repository Assets
        if: success() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p assets shell/final-product artifacts/debug
          cp "${{ steps.apk_locator.outputs.apk_path }}" "assets/SavageBrowser-v2.0.0.apk"
          cp "${{ steps.apk_locator.outputs.apk_path }}" "shell/final-product/SavageBrowser-debug.apk"
          cp "${{ steps.apk_locator.outputs.apk_path }}" "artifacts/debug/SavageBrowser-debug.apk"
          if git diff --quiet -- assets shell/final-product artifacts/debug; then
            echo "APK bytes unchanged; nothing to sync."
            exit 0
          fi
          git add "assets/SavageBrowser-v2.0.0.apk" "shell/final-product/SavageBrowser-debug.apk" "artifacts/debug/SavageBrowser-debug.apk"
          git commit -m "ci: sync verified Gradle-built APK into assets [skip ci]"
          git push

      - name: Create Release Tag
        id: release_tag
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/d7793b18-savage-tech-corner'
          || github.event_name == 'workflow_dispatch')
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.apk_locator.outputs.version_name }}"
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          # Tag the branch tip, which now includes any APK sync commit produced above
          git fetch origin "$BRANCH_NAME"
          git tag -a "$TAG" "$(git rev-parse "origin/$BRANCH_NAME")" -m "Savage Browser v${VERSION} — CI build ${GITHUB_RUN_NUMBER}"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release (Auto Per-Build)
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/d7793b18-savage-tech-corner'
          || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Savage Browser ${{ steps.release_tag.outputs.tag }}
          files: ${{ steps.apk_locator.outputs.apk_path }}
          generate_release_notes: true
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release (Version Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk_locator.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
