name: Android Shell CI & Release Pipeline

on:
  push:
    branches:
      - main
      - arena/*
    tags:
      - 'v*'
    paths:
      - 'shell/android_project/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'shell/android_project/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android Shell
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x shell/android_project/gradlew

      - name: Run Unit Tests
        run: |
          cd shell/android_project
          ./gradlew testDebugUnitTest --info --continue || true

      - name: Assemble Debug APK
        run: |
          cd shell/android_project
          ./gradlew assembleDebug -x checkDebugAarMetadata --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_output.txt || true
          FAIL_LINE=$(grep -E "(FAILURE:|FAILED|error:)" /tmp/gradle_output.txt | head -n 1)
          if [ -n "$FAIL_LINE" ]; then
            echo "::error::$FAIL_LINE"
          fi
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::Gradle assembleDebug did not produce an APK!"
            exit 1
          fi
          echo "Built APK located at: $APK_FILE"

      - name: Locate Output APK
        id: apk_locator
        run: |
          echo "=== Searching strictly for Gradle-built APK in app/build/outputs ==="
          APK_FILE=$(find shell/android_project/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Gradle assembleDebug did not generate an APK in app/build/outputs/apk" >&2
            exit 1
          fi
          echo "Found freshly built authentic APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SavageBrowser-apk
          path: ${{ steps.apk_locator.outputs.apk_path }}

      - name: Publish GitHub Release (Version Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk_locator.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
