name: Android Build, Test and Release

# The authoritative Android pipeline for Savage Browser.
#
# It runs on a clean GitHub-hosted checkout with a real Android SDK, a real emulator and a real
# Gradle build, because those are the only things that can produce installable APK evidence.
# No step may hide a failure: the workflow uses no error-suppressing modifiers of any kind
# (see shell/tests/test_android_assets.py, which fails if one is ever added), and every action is
# pinned to a full commit SHA. A release is only published for a version tag, and only when the APK
# really is signed.

on:
  push:
    branches:
      - main
      - arena/**
    tags:
      - "v*"
    paths:
      - "shell/android_project/**"
      - "shell/tests/test_android_assets.py"
      - "tools/reproducible_build_verifier.py"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "shell/android_project/**"
      - "shell/tests/test_android_assets.py"
      - "tools/reproducible_build_verifier.py"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The GitHub-hosted runner image already provides the Android SDK; this step proves it and
      # installs the exact platform and build-tools the build pins, instead of hiding the check
      # behind a third-party setup action.
      - name: Prepare the Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::no Android SDK on this runner (ANDROID_HOME unset)"
            exit 1
          fi
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager)
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in $SDK_ROOT"
            exit 1
          fi
          printf 'y\n%.0s' {1..40} | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          "$SDKMANAGER" --list_installed | sed -n '1,30p'
          test -d "$SDK_ROOT/platforms/android-35" || {
            echo "::error::platform android-35 is not installed"; exit 1; }
          test -d "$SDK_ROOT/build-tools/35.0.0" || {
            echo "::error::build-tools 35.0.0 are not installed"; exit 1; }
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify the SDK packages the build pins
        run: |
          set -euo pipefail
          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/build-tools/35.0.0"
          echo "platform 35 and build-tools 35.0.0 present under $SDK_ROOT"

      - name: Repository invariants (assets, manifest, pins, no placeholders)
        run: python3 -m unittest discover -s shell/tests -v

      - name: Fail on dynamic dependency versions
        run: |
          if grep -nE '(implementation|testImplementation|androidTestImplementation)\([^)]*\+["\x27]' \
              shell/android_project/app/build.gradle.kts; then
            echo "::error::dynamic dependency versions are not allowed"
            exit 1
          fi

      - name: Gradle clean
        working-directory: shell/android_project
        run: set -euo pipefail; chmod +x gradlew && ./gradlew clean --stacktrace --no-daemon 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Unit tests (JVM)
        working-directory: shell/android_project
        run: set -euo pipefail; ./gradlew testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Android Lint (abortOnError)
        working-directory: shell/android_project
        run: set -euo pipefail; ./gradlew lintDebug lintRelease --stacktrace --no-daemon 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Assemble debug APK
        working-directory: shell/android_project
        run: set -euo pipefail; ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Assemble release APK (R8 + resource shrinking)
        working-directory: shell/android_project
        run: set -euo pipefail; ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Assemble instrumented test APK
        working-directory: shell/android_project
        run: set -euo pipefail; ./gradlew assembleDebugAndroidTest --stacktrace --no-daemon 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Inspect and hash the built APKs
        id: apk
        run: |
          set -euo pipefail
          DEBUG_APK=$(find shell/android_project/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          RELEASE_APK=$(find shell/android_project/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$DEBUG_APK" ] || [ -z "$RELEASE_APK" ]; then
            echo "::error::a build output APK is missing (debug='$DEBUG_APK' release='$RELEASE_APK')"
            exit 1
          fi
          for apk in "$DEBUG_APK" "$RELEASE_APK"; do
            echo "=== $apk ==="
            unzip -t "$apk"
            unzip -l "$apk" | grep -E 'classes.dex|AndroidManifest.xml|resources.arsc'
            "${ANDROID_HOME}/build-tools/35.0.0/aapt2" dump badging "$apk" | head -n 12
          done
          APK_SHA256=$(sha256sum "$DEBUG_APK" | cut -d' ' -f1)
          RELEASE_SHA256=$(sha256sum "$RELEASE_APK" | cut -d' ' -f1)
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "RELEASE_SHA256=$RELEASE_SHA256" >> "$GITHUB_OUTPUT"
          echo "DEBUG_APK=$DEBUG_APK" >> "$GITHUB_OUTPUT"
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          # Paths relative to the repository root, so the emulator job can check them from the
          # workspace root after it downloads this artifact.
          printf '%s  %s\n%s  %s\n' "$APK_SHA256" "$DEBUG_APK" \
            "$RELEASE_SHA256" "$RELEASE_APK" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Verify the debug APK signature (v1 + v2 + v3)
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            "${{ steps.apk.outputs.DEBUG_APK }}" | tee apksigner-debug.txt
          grep -q "Verified using v1 scheme" apksigner-debug.txt
          grep -q "Verified using v2 scheme" apksigner-debug.txt

      - name: Verify release APK signing state (unsigned is reported, not hidden)
        run: |
          set -euo pipefail
          if "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose \
              "${{ steps.apk.outputs.RELEASE_APK }}" > release-signing.txt 2>&1; then
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
            cat release-signing.txt
          else
            echo "RELEASE_SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::release APK is UNSIGNED - no keystore.properties was supplied to CI."
            cat release-signing.txt
          fi

      - name: Verify APK identity, version and provenance
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install "androguard>=4.0"
          {
            python3 tools/reproducible_build_verifier.py --apk "${{ steps.apk.outputs.DEBUG_APK }}" \
              --expect-signed --json apk-evidence.json
            cat apk-evidence.json
          } 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          # The run keeps its own evidence: a notice annotation survives in the checks API, so the
          # APK identity this run verified can be read back after the runner is gone.
          python3 - <<'PYEOF'
          import io, json
          evidence = json.load(io.open("apk-evidence.json", encoding="utf-8"))
          facts = [
              f"apk={evidence['apk']}",
              f"size_bytes={evidence['size_bytes']}",
              f"sha256={evidence['sha256']}",
              f"package={evidence['package']} versionName={evidence['version_name']} "
              f"versionCode={evidence['version_code']}",
              f"min_sdk={evidence['min_sdk']} target_sdk={evidence['target_sdk']}",
              f"permissions={evidence['permissions']}",
              f"signed v1={evidence['is_signed_v1']} v2={evidence['is_signed_v2']} "
              f"v3={evidence['is_signed_v3']}",
              f"certificate={evidence['certificate_subject']} "
              f"sha256={evidence['certificate_sha256']}",
              f"launcher={evidence['main_activity']}",
          ]
          print("::notice title=APK evidence::" + "%0A".join(facts))
          PYEOF

      # A hosted runner's raw log is not always retrievable through the API; every shell step above
      # appends to one log file and this step turns the end of it into error annotations, so a red
      # build is diagnosable from the commit's checks instead of being a mystery.
      - name: Surface the failure
        if: failure()
        run: |
          set -uo pipefail
          LOG="${RUNNER_TEMP:-/tmp}/build.log"
          if [ ! -s "$LOG" ]; then
            echo "::error title=CI failure::nothing was logged - the failure happened before any build step ran"
            exit 0
          fi
          python3 - "$LOG" <<'PYEOF'
          import io, sys
          lines = [l.rstrip() for l in
                   io.open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()]
          keys = ("FAILURE:", "What went wrong", "Caused by:", "Execution failed", "error:", "ERROR",
                  "FAIL", "Error", "Could not", "Cannot", "Unsupported", "A problem occurred",
                  "Traceback", "AssertionError", "mismatch", "expected")
          picked = [l for l in lines if any(k in l for k in keys)]
          tail = picked[-60:] if picked else []
          tail += ["..."] if tail else []
          tail += lines[-45:]
          def esc(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          for i in range(0, len(tail), 12):
              print("::error title=CI failure tail::" + esc("\n".join(tail[i:i + 12])))
          PYEOF

      - name: Upload APKs, reports and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: savage-browser-apk
          if-no-files-found: error
          path: |
            shell/android_project/app/build/outputs/apk/debug/*.apk
            shell/android_project/app/build/outputs/apk/release/*.apk
            SHA256SUMS.txt
            apk-evidence.json
            apksigner-debug.txt
            shell/android_project/app/build/reports/lint-results-debug.html
            shell/android_project/app/build/reports/tests/testDebugUnitTest/**
            shell/android_project/app/build/test-results/**

  instrumented:
    name: Emulator instrumented tests and install smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The GitHub-hosted runner image already provides the Android SDK; this step proves it and
      # installs the exact platform and build-tools the build pins, instead of hiding the check
      # behind a third-party setup action.
      - name: Prepare the Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::no Android SDK on this runner (ANDROID_HOME unset)"
            exit 1
          fi
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager)
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in $SDK_ROOT"
            exit 1
          fi
          printf 'y\n%.0s' {1..40} | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          "$SDKMANAGER" --list_installed | sed -n '1,30p'
          test -d "$SDK_ROOT/platforms/android-35" || {
            echo "::error::platform android-35 is not installed"; exit 1; }
          test -d "$SDK_ROOT/build-tools/35.0.0" || {
            echo "::error::build-tools 35.0.0 are not installed"; exit 1; }
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      # The emulator job starts from a clean checkout, so the APK it installs has to be the one the
      # build job produced - not a rebuild, and never a file carried inside the repository.
      - name: Download the APKs built by the build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: savage-browser-apk

      - name: Verify the downloaded APK identity
        run: |
          set -euo pipefail
          DEBUG_APK=$(find shell/android_project/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$DEBUG_APK" || { echo "::error::the build job produced no debug APK"; exit 1; }
          echo "installing $DEBUG_APK"
          sha256sum "$DEBUG_APK"
          sha256sum -c SHA256SUMS.txt

      - name: Enable KVM for the emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on an API 35 emulator
        uses: ReactiveCircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -camera-front none -gpu swiftshader_indirect
          disable-animations: true
          # The action runs this with /usr/bin/sh (dash), which rejects bash-only syntax such as
          # `set -o pipefail`; the real work therefore lives in a bash script that dash can invoke.
          script: |
            set -e
            bash tools/ci/android_emulator_run.sh

      - name: Surface the failure
        if: failure()
        run: |
          set -uo pipefail
          LOG="${RUNNER_TEMP:-/tmp}/build.log"
          if [ ! -s "$LOG" ]; then
            echo "::error title=CI failure::nothing was logged on the emulator runner"
            exit 0
          fi
          python3 - "$LOG" <<'PYEOF'
          import io, sys
          lines = [l.rstrip() for l in
                   io.open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()]
          keys = ("FAILED", "AssertionError", "Exception", "FAIL", "FAILURE", "error:", "Error",
                  "no emulator", "failed", "not found", "mismatch", "refused")
          picked = [l for l in lines if any(k in l for k in keys)]
          tail = picked[-60:] if picked else []
          tail += ["..."] if tail else []
          tail += lines[-45:]

          def esc(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          for i in range(0, len(tail), 12):
              print("::error title=CI failure tail::" + esc("\n".join(tail[i:i + 12])))
          PYEOF

      # Evidence collection runs even when the tests failed, so a failure can still be diagnosed.
      # It is not a gate, so it checks for what is there instead of masking command failures.
      - name: Collect emulator evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p emulator-evidence
          if adb devices | grep -qE 'device$'; then
            adb logcat -d > emulator-evidence/logcat.txt
            adb shell dumpsys package com.savage.soulbrowser > emulator-evidence/package.txt
          else
            echo "no emulator attached to this runner" > emulator-evidence/README.txt
          fi
          if [ -d shell/android_project/app/build/outputs/androidTest-results ]; then
            find shell/android_project/app/build/outputs/androidTest-results -type f \
              -exec cp {} emulator-evidence/ \;
          fi
          if [ -d shell/android_project/app/build/reports/androidTests ]; then
            find shell/android_project/app/build/reports/androidTests -type f \
              -exec cp {} emulator-evidence/ \;
          fi
          ls -R emulator-evidence

      - name: Upload instrumented evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-evidence
          if-no-files-found: warn
          path: emulator-evidence/**

  release:
    name: Publish signed release APK
    runs-on: ubuntu-latest
    needs: [build, instrumented]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the verified build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: savage-browser-apk

      - name: Refuse to publish an unsigned APK
        run: |
          set -euo pipefail
          apk=$(ls shell/android_project/app/build/outputs/apk/release/*.apk | head -n 1)
          echo "release candidate: $apk"
          if ! unzip -l "$apk" | grep -qE 'META-INF/.*\.(RSA|DSA|EC)'; then
            echo "::error::the release APK has no v1 signature block; refusing to publish."
            echo "::error::provide keystore.properties to CI (see app/build.gradle.kts) first."
            exit 1
          fi
          sha256sum "$apk"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk=$(ls shell/android_project/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" "SavageBrowser-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "SavageBrowser-${GITHUB_REF_NAME}.apk" \
            SHA256SUMS.txt apk-evidence.json \
            --title "Savage Browser ${GITHUB_REF_NAME}" \
            --notes "Built and verified by the Android Build, Test and Release workflow."
