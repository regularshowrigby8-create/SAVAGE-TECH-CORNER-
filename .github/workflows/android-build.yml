name: Android Shell CI & Release Pipeline

on:
  push:
    branches:
      - main
      - arena/*
    tags:
      - 'v*'
    paths:
      - 'shell/android_project/**'
      - '.github/workflows/android-build.yml'
      - 'tools/vm_crash_and_install_debugger.py'
  pull_request:
    paths:
      - 'shell/android_project/**'
      - '.github/workflows/android-build.yml'
      - 'tools/vm_crash_and_install_debugger.py'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android Shell
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python for VM Diagnostics
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python VM Dependencies
        run: |
          pip install "androguard<4.0" cryptography

      - name: Grant Execute Permission to Gradlew
        run: chmod +x shell/android_project/gradlew

      - name: Assemble Debug APK
        run: |
          cd shell/android_project
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate Output APK
        id: apk_locator
        run: |
          echo "=== Locating compiled APK in build outputs ==="
          find shell/android_project/app/build/outputs/apk/debug/ -type f -name "*.apk" -ls
          SRC_APK=$(find shell/android_project/app/build/outputs/apk/debug/ -type f -name "*.apk" | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "ERROR: Could not find compiled APK" >&2
            exit 1
          fi
          
          TARGET_DIR="shell/android_project/app/build/outputs/apk/debug"
          NAMED_APK="$TARGET_DIR/SavageBrowser-debug.apk"
          if [ "$SRC_APK" != "$NAMED_APK" ]; then
            cp "$SRC_APK" "$NAMED_APK"
          fi
          
          echo "Found freshly built authentic APK: $NAMED_APK"
          echo "apk_path=$NAMED_APK" >> $GITHUB_OUTPUT

      - name: Run Production APK through Android VM Verifier & Diagnostics
        run: |
          echo "=== Executing Android VM Verifier and Crash Diagnostics ==="
          python3 tools/vm_crash_and_install_debugger.py "${{ steps.apk_locator.outputs.apk_path }}" --api 34 --heap 256 --json 2>&1 | tee /tmp/vm_out.json || true
          cat /tmp/vm_out.json
          python3 -c "
          import json, sys
          try:
              # Filter JSON from stdout
              with open('/tmp/vm_out.json') as f:
                  text = f.read()
              # Find JSON block
              start = text.find('{')
              if start != -1:
                  data = json.loads(text[start:])
                  if not data.get('overall_healthy'):
                      print('VM test failed:', data.get('install_errors'), data.get('runtime_crashes'))
                      sys.exit(1)
                  else:
                      print('Android VM test passed cleanly!')
              else:
                  print('No JSON detected')
                  sys.exit(1)
          except Exception as e:
              print('JSON parse error:', e)
              sys.exit(1)
          "

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SavageBrowser-apk
          path: ${{ steps.apk_locator.outputs.apk_path }}

      - name: Publish GitHub Release (Version Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk_locator.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
