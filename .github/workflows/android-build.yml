name: Android Shell CI & Release Pipeline

on:
  push:
    branches:
      - main
      - arena/*
    tags:
      - 'v*'
    paths:
      - 'shell/android_project/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'shell/android_project/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android Shell
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x shell/android_project/gradlew

      - name: Assemble Debug APK with Diagnostic Output
        run: |
          cd shell/android_project
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/assemble.log || true
          ERR_MSG=$(grep -E "(FAILED|Exception|error:|cause:)" /tmp/assemble.log | head -n 10 | tr '\n' ' ' || echo "Unknown error")
          echo "::error::$ERR_MSG"
          # Check if build actually succeeded
          if grep -q "BUILD SUCCESSFUL" /tmp/assemble.log; then
            echo "Build succeeded!"
          else
            echo "Build failed!" >&2
            exit 1
          fi

      - name: Locate Output APK
        id: apk_locator
        run: |
          find shell/android_project/app/build/outputs/apk/debug/ -type f -name "*.apk" -ls
          APK_FILE=$(find shell/android_project/app/build/outputs/apk/debug/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Could not find compiled APK" >&2
            exit 1
          fi
          echo "Found freshly built authentic APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SavageBrowser-apk
          path: ${{ steps.apk_locator.outputs.apk_path }}

      - name: Publish GitHub Release (Version Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk_locator.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
