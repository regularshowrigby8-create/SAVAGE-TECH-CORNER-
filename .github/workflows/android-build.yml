name: Android Shell CI

on:
  push:
    paths:
      - 'shell/android_project/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'shell/android_project/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android Shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x shell/android_project/gradlew

      - name: Run Unit Tests
        run: |
          cd shell/android_project
          ./gradlew testDebugUnitTest

      - name: Assemble Debug APK
        run: |
          cd shell/android_project
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SavageBrowser-debug-apk
          path: shell/android_project/app/build/outputs/apk/debug/*.apk
