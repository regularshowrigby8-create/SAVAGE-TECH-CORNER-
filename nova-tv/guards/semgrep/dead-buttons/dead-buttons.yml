rules:
  - id: empty-click-handler
    languages: [kotlin]
    severity: ERROR
    message: >-
      This control has a click handler that does nothing. Give it the action
      its label promises, or remove it.
    paths:
      include: ["**/src/main/**"]
    pattern-either:
      - pattern: '$F(..., onClick = { }, ...)'
      - pattern: '$F(..., onClick = {}, ...)'
      - pattern: '$M.clickable { }'
      - pattern: '$M.clickable(...) { }'
      - pattern: '$F(..., onLongClick = { }, ...)'

  - id: click-handler-is-todo
    languages: [kotlin]
    severity: ERROR
    message: >-
      This handler calls TODO(), so pressing the control crashes the app.
    paths:
      include: ["**/src/main/**"]
    pattern-either:
      - pattern: 'TODO()'
      - pattern: 'TODO($MSG)'

  - id: setter-only-records-state
    languages: [kotlin]
    severity: ERROR
    message: >-
      `$SET` only writes the new value into UI state and never applies it to
      the thing it controls, so the control that calls it changes nothing on
      screen.
    paths:
      include: ["**/src/main/**"]
    patterns:
      - pattern: |
          override fun $SET(...) {
            $STATE.update { it.copy(...) }
          }
      - metavariable-regex:
          metavariable: $SET
          regex: ^set[A-Z]
