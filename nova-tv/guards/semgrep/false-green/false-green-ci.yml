rules:
  # --- CI steps that cannot fail ----------------------------------------------
  - id: ci-continue-on-error
    languages: [yaml]
    severity: ERROR
    message: >-
      continue-on-error: true turns this step's failure into a green tick.
    pattern: 'continue-on-error: true'

  - id: ci-or-true
    languages: [generic]
    severity: ERROR
    message: >-
      `|| true` / `|| exit 0` throws away this command's exit status, so the
      step is green even when the command fails.
    pattern-regex: '\|\|\s*(true|exit\s+0|:)\s*(;|$|\))'

  - id: ci-upload-ignores-missing-files
    languages: [yaml]
    severity: WARNING
    message: >-
      if-no-files-found: ignore means this upload succeeds even when the file
      it promises was never written.
    pattern: 'if-no-files-found: ignore'
