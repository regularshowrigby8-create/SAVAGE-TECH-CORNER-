# From Drjacky/MVVMTemplate (MIT) gradle.properties, minus the daemon setting.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC
kotlin.code.style=official
android.useAndroidX=true
org.gradle.caching=true
# Parallel is off: R8 on a 2-core runner with 2 workers runs out of heap
# and reports it as an unrelated failure. Build time is not the constraint;
# getting a signed release is.
org.gradle.parallel=false
org.gradle.warning.mode=summary
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Set by CI to keep heap predictable on a 2-core runner.
org.gradle.workers.max=2
